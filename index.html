<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #d1d7db; /* WhatsApp web achtergrond */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- HOOFDCONTAINER --- */
        #whatsappContainer {
            display: flex;
            width: 100%;
            max-width: 1396px;
            height: 95vh;
            background-color: #ffffff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        /* --- LINKERKOLOM: CHATLIJST --- */
        .sidebar {
            width: 35%;
            max-width: 400px;
            min-width: 300px;
            background-color: #ffffff;
            border-right: 1px solid #e9edef;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 60px;
            background-color: #aebac1; /* Originele WhatsApp groen-grijs */
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .my-avatar {
            width: 40px;
            height: 40px;
            background-color: #53bdeb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0f2f5;
            transition: background 0.1s;
        }

        .chat-item:hover {
            background-color: #f0f2f5;
        }

        .chat-item.active {
            background-color: #eaebeb;
        }

        .friend-avatar {
            width: 49px;
            height: 49px;
            background-color: #00a884; /* WhatsApp groen */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-right: 15px;
        }

        .chat-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .friend-name {
            font-size: 16px;
            font-weight: 500;
            color: #111b21;
        }

        .chat-time {
            font-size: 12px;
            color: #667781;
        }

        .last-msg {
            font-size: 14px;
            color: #667781;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        /* --- RECHTERKOLOM: HET CHATSCHERM --- */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #efeae2; /* De beige WhatsApp achtergrond met patroon */
            position: relative;
        }

        /* Startscherm als er geen chat geselecteerd is */
        #emptyState {
            position: absolute;
            inset: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        #emptyState h2 { color: #41525d; font-weight: 300; margin-bottom: 10px; }
        #emptyState p { color: #667781; font-size: 14px; }

        .chat-header {
            height: 60px;
            background-color: #f0f2f5;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e9edef;
        }

        .chat-header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-text {
            font-size: 13px;
            color: #667781;
        }

        /* BUBBLES ZONE */
        .messages-area {
            flex: 1;
            padding: 20px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            max-width: 65%;
            padding: 8px 12px 28px 12px;
            border-radius: 8px;
            font-size: 14.2px;
            color: #111b21;
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
            user-select: text;
        }

        .msg-bubble.sent {
            background-color: #d9fdd3; /* WhatsApp lichte groen voor verzonden */
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .msg-bubble.received {
            background-color: #ffffff; /* Wit voor ontvangen */
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .msg-time {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 11px;
            color: #667781;
        }

        /* INPUT BALK ONDERAAN */
        .input-bar {
            height: 62px;
            background-color: #f0f2f5;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            background-color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            color: #111b21;
        }

        .send-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #00a884;
            transition: transform 0.1s;
        }
        .send-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="whatsappContainer">
        <!-- LINKERKOLOM: CONTACTEN LIJST -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="my-avatar">E</div>
                <div style="font-weight: bold; color: #111b21;">Chats</div>
            </div>
            
            <div class="chat-list">
                <!-- Vriend 1 -->
                <div class="chat-item" id="item_sam" onclick="openChat('sam', 'Sam', '👨‍💻')">
                    <div class="friend-avatar">👨‍💻</div>
                    <div class="chat-item-info">
                        <div class="chat-item-header">
                            <div class="friend-name">Sam</div>
                            <div class="chat-time">18:12</div>
                        </div>
                        <div class="last-msg" id="last_sam">Kom je online? Spel staat klaar.</div>
                    </div>
                </div>

                <!-- Vriend 2 -->
                <div class="chat-item" id="item_lina" onclick="openChat('ninja', 'Lina', '🙋‍♀️')">
                    <div class="friend-avatar" style="background:#ff5376;">🙋‍♀️</div>
                    <div class="chat-item-info">
                        <div class="chat-item-header">
                            <div class="friend-name">Lina</div>
                            <div class="chat-time">Gisteren</div>
                        </div>
                        <div class="last-msg" id="last_ninja">Hahaha, dat was echt grappig!</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RECHTERKOLOM: ACTIVE CONVERSATIE -->
        <div class="chat-window">
            <!-- Startscherm (Verdwijnt bij klik op vriend) -->
            <div id="emptyState">
                <div style="font-size: 80px; margin-bottom: 15px;">💬</div>
                <h2>WhatsApp Edem</h2>
                <p>Klik op een vriend in de lijst om direct een chat te starten.</p>
            </div>

            <!-- Chat Header -->
            <div class="chat-header">
                <div class="friend-avatar" id="activeAvatar" style="width:40px; height:40px; font-size:18px; margin-right:12px;">👨‍💻</div>
                <div class="chat-header-info">
                    <div class="friend-name" id="activeName">Vriend</div>
                    <div class="status-text" id="activeStatus">online</div>
                </div>
            </div>

            <!-- Berichten Matrix -->
            <div class="messages-area" id="msgContainer">
                <!-- Berichten verschijnen hier dynamically -->
            </div>

            <!-- Invoerbalk -->
            <div class="input-bar">
                <input type="text" class="message-input" id="chatInput" placeholder="Typ een bericht" onkeydown="checkEnterKey(event)">
                <button class="send-btn" onclick="sendMessageAction()">🕊️</button>
            </div>
        </div>
    </div>

    <script>

        const botReplies = {
            sam: ["Yo! Wat ben je aan het maken?", "Vet cool gedaan bro!", "Werkt die chat nu echt?", "Zullen we zo gamen?"],
