<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Ultieme Klik Game</title>
    <style>
        /* CSS: Zorgt ervoor dat de site er strak en modern uitziet */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #252542);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin-bottom: 10px;
            color: #00ffcc;
        }

        .score-display {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            color: #fff;
        }

        /* De grote actieknop */
        .click-btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;
            color: #1e1e2f;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .click-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.7);
        }

        .click-btn:active {
            transform: scale(0.95);
        }

        .shop-container {
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
        }

        .upgrade-btn {
            background-color: #3a3a52;
            border: 1px solid #00ffcc;
            color: white;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .upgrade-btn:hover:not(:disabled) {
            background-color: #00ffcc;
            color: #1e1e2f;
        }

        .upgrade-btn:disabled {
            border-color: #555;
            color: #777;
            cursor: not-allowed;
        }

        .stats {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Klikker Mania 🚀</h1>
        <p>Klik op de knop en word rijk!</p>
        
        <div class="score-display">Punten: <span id="score">0</span></div>
        
        <button class="click-btn" id="clickMe">KLIK HIER!</button>

        <div class="shop-container">
            <h3>Winkel 🛒</h3>
            <button class="upgrade-btn" id="buyUpgrade" disabled>Koop Automatische Klikker (Kost: 50)</button>
            <div class="stats">Autoklikkers: <span id="cps-count">0</span> (Genereert +1 punt/sec)</div>
        </div>
    </div>

    <script>
        // JavaScript: Regelt de logica en interactie van de website
        let score = 0;
        let upgradeCost = 50;
        let autoClicks = 0;

        const scoreDisplay = document.getElementById('score');
        const clickBtn = document.getElementById('clickMe');
        const upgradeBtn = document.getElementById('buyUpgrade');
        const cpsDisplay = document.getElementById('cps-count');

        // Update de interface en check of je upgrades kunt betalen
        function updateUI() {
            scoreDisplay.textContent = Math.floor(score);
            upgradeBtn.textContent = `Koop Automatische Klikker (Kost: ${upgradeCost})`;
            
            if (score >= upgradeCost) {
                upgradeBtn.disabled = false;
            } else {
                upgradeBtn.disabled = true;
            }
        }

        // Handmatig klikken
        clickBtn.addEventListener('click', () => {
            score += 1;
            updateUI();
        });

        // Upgrade kopen
        upgradeBtn.addEventListener('click', () => {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                autoClicks += 1;
                upgradeCost = Math.round(upgradeCost * 1.5); // Maakt de volgende upgrade duurder
                cpsDisplay.textContent = autoClicks;
                updateUI();
            }
        });

        // Automatische klikker loop (elke seconde)
        setInterval(() => {
            if (autoClicks > 0) {
                score += autoClicks;
                updateUI();
            }
        }, 1000);
    </script>
</body>
</html>
