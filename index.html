<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Clicker Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            overflow: hidden;
            color: #fff;
            transition: background 0.5s;
        }

        /* Mini-TV rechtsboven */
        .mini-tv {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 100px;
            background-color: #111;
            border: 6px solid #334155;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .tv-scherm {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #0284c7 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: #38bdf8;
            font-family: monospace;
            text-shadow: 0 0 5px #38bdf8;
        }

        @keyframes tvGlitch {
            0% { background: #ef4444; }
            50% { background: #eab308; }
            100% { background: #3b82f6; }
        }
        .tv-alert { animation: tvGlitch 0.2s infinite; color: white !important; font-weight: bold; }

        /* Controlepaneel in het midden */
        .control-panel {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: opacity 0.5s;
        }

        .teller-container {
            font-size: 1.5rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        #teller {
            color: #38bdf8;
            font-size: 4.5rem;
            display: block;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .klik-knop {
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
            transition: transform 0.1s, background 0.3s;
        }
        .klik-knop:hover { transform: translateY(-2px); }
        .klik-knop:active { transform: scale(0.95); }

        /* De verborgen cheat-balk helemaal onderaan */
        .verstopte-knop {
            position: absolute;
            bottom: 0px;
            left: 0px;
            width: 100%;
            height: 40px;
            background: transparent;
            border: none;
            color: transparent;
            cursor: pointer;
            z-index: 20;
            font-size: 0.8rem;
            transition: all 0.3s;
            text-align: center;
        }
        .verstopte-knop:hover {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.3);
        }

        /* Taart event voor 999 kliks */
        .taart-container {
            display: none;
            position: absolute;
            z-index: 30;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .kaarsjes-box {
            display: flex;
            gap: 15px;
            margin-bottom: -5px;
        }
        .kaars {
            width: 8px;
            height: 35px;
            background: linear-gradient(to bottom, #eab308, #ef4444);
            position: relative;
        }
        .vlam {
            width: 12px;
            height: 18px;
            background: radial-gradient(circle, #ffea00 0%, #ff7b00 100%);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -20px;
            left: -2px;
            animation: flakkeren 0.1s infinite alternate;
            box-shadow: 0 0 10px #ffea00;
        }
        @keyframes flakkeren {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        .taart-emoji {
            font-size: 6rem;
            line-height: 1;
        }

        .blaas-knop {
            margin-top: 25px;
            padding: 15px 35px;
            font-size: 1.2rem;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
        .shake-effect { animation: shake 0.1s infinite; color: #f43f5e !important; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="mini-tv">
        <div class="tv-scherm" id="tvScherm">MODE: NORMAL</div>
    </div>

    <div class="control-panel" id="hoofdPaneel">
        <div class="teller-container">
            Score: <span id="teller">0</span>
        </div>
        <button class="klik-knop" id="hoofdKnop" onclick="verhoogTeller()">HIT ME!</button>
    </div>

    <!-- TAART EVENT -->
    <div class="taart-container" id="taartEvent">
        <div class="kaarsjes-box">
            <div class="kaars"><div class="vlam" id="vlam1"></div></div>
            <div class="kaars"><div class="vlam" id="vlam2"></div></div>
            <div class="kaars"><div class="vlam" id="vlam3"></div></div>
        </div>
        <div class="taart-emoji">🎂</div>
        <button class="blaas-knop" onclick="blaasKaarsjesUit()">BLAAS DE KAARSEN UIT! (KLIK 1000)</button>
    </div>

    <!-- DE VERSTOPTE CHEAT BALK -->
    <button class="verstopte-knop" id="cheatKnop" onclick="activeerCheat()">▲ [ GEHEIME CHEAT: KLIK HIER ] ▲</button>

    <script>
        let aantalKliks = 0;
        let feestInterval;

        // Confetti initialisatie
        const canvas = document.getElementById("confetti-canvas");
        const ctx = canvas.getContext("2d");
        let confettiStukjes = [];
        const kleuren = ["#38bdf8", "#34d399", "#fb7185", "#f43f5e", "#fbbf24", "#a78bfa"];

        function pasCanvasFormaatAan() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener("resize", pasCanvasFormaatAan);
        pasCanvasFormaatAan();

        function verhoogTeller() {
            aantalKliks++;
            updateSpelStatus();
        }

        function activeerCheat() {
            aantalKliks = 998; 
            document.getElementById('cheatKnop').style.display = 'none'; 
            updateSpelStatus();
        }

        function updateSpelStatus() {
            const tellerElement = document.getElementById('teller');
            const tvElement = document.getElementById('tvScherm');
            
            tellerElement.innerText = aantalKliks;

            if (aantalKliks < 500) { 
                tvElement.innerText = "MODE: NORMAL"; 
            }

            // 1. Confetti elke 100 kliks (behalve bij 500 en 999)
            if (aantalKliks % 100 === 0 && aantalKliks !== 500) {
                gooiConfetti(40);
                tvElement.innerText = "BOOM! +100";
            }

            // 2. Bij 500 kliks
            if (aantalKliks === 500) {
                tellerElement.classList.add('shake-effect');
                tvElement.classList.add('tv-alert');
                tvElement.innerText = "⚠️ DANGER ⚠️";
                gooiConfetti(100);
                setTimeout(() => {
                    tellerElement.classList.remove('shake-effect');
                    tvElement.classList.remove('tv-alert');
                    tvElement.innerText = "MODE: HARD";
                }, 3000);
            }

            // 3. Bij 999 kliks wordt het scherm zwart en komt de taart
            if (aantalKliks === 999) {
                document.body.style.background = "#000"; 
                document.getElementById('hoofdPaneel').style.opacity = "0"; 
                document.getElementById('hoofdPaneel').style.pointerEvents = "none";
                tvElement.innerText = "MAKE A WISH";
                
                setTimeout(() => {
                    document.getElementById('taartEvent').style.display = "flex";
                }, 500);
            }
        }

        function blaasKaarsjesUit() {
            aantalKliks++; 
            
            document.getElementById('vlam1').style.display = 'none';
            document.getElementById('vlam2').style.display = 'none';
            document.getElementById('vlam3').style.display = 'none';
