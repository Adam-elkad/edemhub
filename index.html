<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edem Falls</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Startscherm Menu */
        #menu-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            z-index: 10;
        }

        /* Kleine vierhoek/knop */
        .start-button {
            width: 150px;
            height: 150px;
            background-color: #1f6feb;
            border: 3px solid #58a6ff;
            border-radius: 8px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background-color 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
            background-color: #238636;
            border-color: #2ea043;
        }

        /* Spelscherm Layout */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #58a6ff;
            margin-bottom: 5px;
            font-size: 32px;
        }

        .instructions {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* Het blauw omlijnde speelveld uit jouw afbeelding */
        #game-canvas {
            border: 4px solid #58a6ff;
            border-radius: 10px;
            background-color: #0d1117;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- STAP 1: HET LEGE START SCHERM MET VIERHOEK -->
    <div id="menu-screen">
        <button class="start-button" onclick="startGame()">Edem Falls</button>
    </div>

    <!-- STAP 2: HET RECHTE SPELSCHERM -->
    <div id="game-screen">
        <h1>Edem Falls 🌟</h1>
        <div class="instructions">Gebruik de Pijltjestoetsen (Links / Rechts) om de mand te bewegen!</div>
        <canvas id="game-canvas" width="450" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");

        // Game variabelen
        let score = 0;
        let gameOver = false;

        // Het mandje (blauw balkje onderaan)
        const basket = {
            x: 50,
            y: 520,
            width: 70,
            height: 15,
            speed: 8
        };

        // De vallende ster (geel rondje)
        const star = {
            x: Math.random() * (canvas.width - 20) + 10,
            y: 50,
            radius: 8,
            speed: 4
        };

        // Toetsenbord status tracking
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        // Functie die wisselt van menu naar het spel
        function startGame() {
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "flex";
            
            // Start de game loop
            updateGame();
        }

        // Besturing luisteraars
        window.addEventListener("keydown", (e) => {
            if (e.key in keys) keys[e.key] = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key in keys) keys[e.key] = false;
        });

        // Game Update Logica
        function updateGame() {
            if (gameOver) return;

            // Beweeg het mandje naar links of rechts
            if (keys.ArrowLeft && basket.x > 0) {
                basket.x -= basket.speed;
            }
            if (keys.ArrowRight && basket.x < canvas.width - basket.width) {
                basket.x += basket.speed;
            }

            // Laat de ster vallen
            star.y += star.speed;

            // Check of de ster de bodem raakt (gemist)
            if (star.y > canvas.height) {
                // Reset de ster naar boven
                star.y = 40;
                star.x = Math.random() * (canvas.width - 20) + 10;
                // Optioneel: score verlagen of levens aftrekken kan hier
            }

            // Botsingsdetectie: Vangt het mandje de ster op?
            if (
                star.y + star.radius >= basket.y &&
                star.x >= basket.x &&
                star.x <= basket.x + basket.width
            ) {
                score += 1;
                // Verhoog de snelheid een klein beetje voor extra uitdaging
                star.speed += 0.2;
                // Reset de ster weer naar boven
                star.y = 40;
                star.x = Math.random() * (canvas.width - 20) + 10;
            }

            drawGame();

            // Blijf de game verversen
            requestAnimationFrame(updateGame);
        }

        // Teken alles op het canvas
        function drawGame() {
            // Maak het scherm leeg voor de nieuwe frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Teken de score linksboven (net als op jouw foto)
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 20, 35);

            // 2. Teken de vallende gele ster
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffc107"; // Mooi ster-geel
            ctx.fill();
            ctx.closePath();

            // 3. Teken de mand (het lichtblauwe balkje)
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
        }
    </script>
</body>
</html>
