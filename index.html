<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDEM's Arcade Hub 🎮</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #090d16;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #arcade-container {
            position: relative;
            width: 500px;
            height: 600px;
            background: #111827;
            border: 4px solid #ff007f;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            overflow: hidden;
        }
        /* Menu Style */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111827 0%, #0f172a 100%);
            padding: 40px;
        }
        #menu-screen h2 {
            color: #00f5ff;
            margin-bottom: 30px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.4);
        }
        .menu-btn {
            width: 80%;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }
        /* Game Screens */
        .game-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        canvas {
            background: #060913;
            display: block;
        }
        /* UI & Back Button */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .score-tag {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f5ff;
            text-shadow: 0 0 5px rgba(0, 245, 255, 0.5);
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 6px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #f94144;
            border-color: #f94144;
        }
        /* Game Over Overlay */
        .game-over-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .game-over-overlay h3 {
            color: #f94144;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .game-over-overlay p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>EDEM's Arcade Hub 🎮</h1>

    <div id="arcade-container">
        <!-- HOOFDMENU -->
        <div id="menu-screen">
            <h2>KIES EEN GAME OM TE STARTEN:</h2>
            <button class="menu-btn" onclick="startGame('jump')">🚀 1. Edem Jump</button>
            <button class="menu-btn" onclick="startGame('breaker')">🧱 2. Edem Breaker</button>
            <button class="menu-btn" onclick="startGame('snake')">🐍 3. Edem Snake</button>
        </div>

        <!-- GAME INTERFACES -->
        <div id="game-screen" class="game-screen">
            <div class="hud">
                <div id="score-display" class="score-tag">Score: 0</div>
                <button class="back-btn" onclick="returnToMenu()">Menu ↩</button>
            </div>
            <canvas id="gameCanvas" width="492" height="592"></canvas>
            
            <div id="over-overlay" class="game-over-overlay">
                <h3>GAME OVER</h3>
                <p id="final-score">Score: 0</p>
                <button class="menu-btn" style="width:auto; padding:10px 25px;" onclick="restartCurrentGame()">Opnieuw proberen</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const overOverlay = document.getElementById('over-overlay');
        const scoreDisplay = document.getElementById('score-display');
        const finalScore = document.getElementById('final-score');

        let currentGame = '';
        let gameLoop;
        let score = 0;
        let keys = {};

        // Key listeners
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function startGame(gameType) {
            menuScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            overOverlay.style.display = 'none';
            currentGame = gameType;
            score = 0;
            scoreDisplay.innerText = "Score: " + score;
            
            if (gameLoop) cancelAnimationFrame(gameLoop);
            
            if (gameType === 'jump') initJump();
            else if (gameType === 'breaker') initBreaker();
            else if (gameType === 'snake') initSnake();
        }

        function returnToMenu() {
            if (gameLoop) cancelAnimationFrame(gameLoop);
            currentGame = '';
            gameScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        }

        function triggerGameOver() {
            cancelAnimationFrame(gameLoop);
            finalScore.innerText = "Jouw score: " + score;
            overOverlay.style.display = 'flex';
        }

        function restartCurrentGame() {
            startGame(currentGame);
        }

        // ==========================================
        // 1. EDEM JUMP (Flappy Bird mechanics)
        // ==========================================
        let bird, pipes, jumpFrame;
        
        function initJump() {
            bird = { x: 50, y: 250, vy: 0, radius: 14, gravity: 0.4, jump: -7 };
            pipes = [];
            jumpFrame = 0;
            window.addEventListener('keydown', handleJumpPress);
            runJump();
        }

        function handleJumpPress(e) {
            if (e.key === ' ' || e.key === 'ArrowUp') bird.vy = bird.jump;
        }

        function runJump() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            jumpFrame++;

            // Bird physics
            bird.vy += bird.gravity;
            bird.y += bird.vy;

            // Draw Edem Ball
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff007f';
            ctx.fill();
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 10;
            ctx.closePath();
            ctx.shadowBlur = 0;

            // Obstacles generation
            if (jumpFrame % 100 === 0) {
                let gap = 130;
                let topHeight = Math.random() * (canvas.height - gap - 100) + 50;
                pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - gap, passed: false });
            }

            // Move and draw obstacles
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= 3;

                ctx.fillStyle = '#00f5ff';
                // Top
                ctx.fillRect(p.x, 0, 50, p.top);
                // Bottom
                ctx.fillRect(p.x, canvas.height - p.bottom, 50, p.bottom);

                // Points check
                if (!p.passed && p.x + 50 < bird.x) {
                    score++;
                    scoreDisplay.innerText = "Score: " + score;
                    p.passed = true;
                }

                // Collision detection
                if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 50) {
                    if (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - p.bottom) {
                        window.removeEventListener('keydown', handleJumpPress);
                        triggerGameOver();
                        return;
                    }
                }

                if (p.x < -50) pipes.splice(i, 1);
            }
