<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdemGames - Poki Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #0f172a;
            color: white;
            overflow-x: hidden;
        }

        /* Top Bar */
        header {
            background: #1e293b;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .logo span {
            color: #10b981;
        }

        /* Categorie Knoppen */
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            background: #0f172a;
        }

        .category-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .category-btn.active {
            background: #3b82f6;
        }

        /* Games Grid Layout */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .game-thumbnail {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }

        .game-info {
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .game-title {
            font-size: 14px;
            font-weight: bold;
        }

        /* --- NIEUW VOLLEDIG SPEELSCHERM (SPACE CLICKER) --- */
        #gameScreen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #1e1b4b 0%, #090514 100%);
            z-index: 1000;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .back-btn:hover { background: #dc2626; }

        .game-body {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Klikbare ruimte links */
        .click-area {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-right: 2px solid rgba(255,255,255,0.1);
        }

        .asteroid {
            width: 160px;
            height: 160px;
            background: #4b5563;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6), inset -10px -10px 20px #1f2937;
            transition: transform 0.05s;
        }

        .asteroid:active {
            transform: scale(0.92);
        }

        /* Shop paneel rechts */
        .shop-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0,0,0,0.3);
        }

        .shop-item {
            background: #1f2937;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .shop-item:hover { background: #374151; }
        .shop-item h4 { font-size: 15px; margin-bottom: 2px; }
        .shop-item p { font-size: 12px; color: #9ca3af; }

        .price-tag {
            background: #eab308;
            color: black;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Portal Scherm -->
    <div id="portalScreen">
        <header>
            <div class="logo">Edem<span>Games</span></div>
            <div style="font-weight: bold; color: #10b981;">🎰 Poki Edition</div>
        </header>

        <div class="categories">
            <button class="category-btn active">Alle Games</button>
            <button class="category-btn">Klikkers</button>
            <button class="category-btn">Arcade</button>
        </div>

        <div class="main-container">
            <div class="games-grid">
                <!-- SPACE CLICKER CARD -->
                <div class="game-card" onclick="openSpaceClicker()">
                    <div class="game-thumbnail" style="background: linear-gradient(135deg, #ec4899, #8b5cf6);">🚀</div>
                    <div class="game-info">
                        <div class="game-title">Space Clicker</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HET NIEUWE IN-GAME SCHERM (SPACE CLICKER) -->
    <div id="gameScreen">
        <div class="game-header">
            <div>
                <h2 style="color: #ec4899; font-size: 26px;">Space Clicker</h2>
                <p style="color: #9ca3af; font-size: 14px;">Klik op de asteroïde en verover het heelal!</p>
            </div>
            <button class="back-btn" onclick="backToPortal()">🏠 SLUIT GAME</button>
        </div>

        <div class="game-body">
            <!-- Linker helft: Spelen -->
            <div class="click-area">
                <h1 id="scrapText" style="font-size: 40px; color: #eab308; margin-bottom: 25px;">🪙 0 Space Scrap</h1>
                <div class="asteroid" id="asteroidTarget" onclick="clickAsteroid()">🪨</div>
                <p style="margin-top: 20px; color: #9ca3af;" id="powerText">+1 per klik</p>
            </div>

            <!-- Rechter helft: Upgrades kopen -->
            <div class="shop-panel">
                <h3 style="color: #10b981; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">Upgrades</h3>
                
                <!-- Upgrade 1 -->
                <div class="shop-item" onclick="buyUpgrade('click')">
                    <div>
                        <h4>Plasma Laser</h4>
                        <p>Je kliks zijn +1 waard</p>
                    </div>
                    <div class="price-tag" id="clickPrice">🪙 15</div>
                </div>

                <!-- Upgrade 2 -->
                <div class="shop-item" onclick="buyUpgrade('auto')">
                    <div>
                        <h4>Mijnschip</h4>
                        <p>Genereert +1 scrap per seconde</p>
                    </div>
                    <div class="price-tag" id="autoPrice">🪙 50</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Spelvariabelen
        let spaceScrap = 0;
        let clickPower = 1;
        let autoIncom = 0;

        let upgradePrices = {
            click: 15,
            auto: 50
        };

        // SCHERM NAVIGATIE
        function openSpaceClicker() {
            document.getElementById('portalScreen').style.display = "none";
            document.getElementById('gameScreen').style.display = "flex";
        }

        function backToPortal() {
            document.getElementById('gameScreen').style.display = "none";
            document.getElementById('portalScreen').style.display = "block";
        }

        // GAMEPLAY LOGICA
        function clickAsteroid() {
            spaceScrap += clickPower;
            updateUI();
            createFloatingText();
        }

        function buyUpgrade(type) {
            if (type === 'click' && spaceScrap >= upgradePrices.click) {
                spaceScrap -= upgradePrices.click;
                clickPower += 1;
                upgradePrices.click = Math.floor(upgradePrices.click * 1.5);
            } 
            else if (type === 'auto' && spaceScrap >= upgradePrices.auto) {
                spaceScrap -= upgradePrices.auto;
                autoIncom += 1;
                upgradePrices.auto = Math.floor(upgradePrices.auto * 1.6);
            }
            updateUI();
        }
