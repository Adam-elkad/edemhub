<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdemGames - Poki Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding-bottom: 60px;
        }

        /* Top Bar & Zoeken */
        header {
            background: #1e293b;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .logo span {
            color: #10b981;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        .search-bar:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }

        /* Categorie Knoppen */
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            overflow-x: auto;
            background: #0f172a;
        }

        .category-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.2s;
        }

        .category-btn:hover, .category-btn.active {
            background: #3b82f6;
            transform: translateY(-2px);
        }

        /* Games Grid Layout */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
        }

        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .game-thumbnail {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
        }

        .game-info {
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .game-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Game Modal Pop-up (Net als Poki) */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 600px;
            height: 500px;
            border-radius: 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.2s;
            z-index: 1010;
        }

        .close-btn:hover {
            color: #ef4444;
        }

        .game-window {
            flex: 1;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- MINI GAMES INTERNE STYLING --- */
        #gameCanvas {
            background: #111827;
            display: none;
        }
        .arcade-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .arcade-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <!-- Bovenbalk -->
    <header>
        <div class="logo" onclick="filterCategory('all')">Edem<span>Games</span></div>
        <div class="search-container">
            <input type="text" class="search-bar" id="searchBar" placeholder="Zoek een game..." onkeyup="searchGames()">
        </div>
        <div style="font-weight: bold; color: #10b981;">🎮 Open Beta</div>
    </header>

    <!-- Categorie Filter Balk -->
    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('all', this)">Alle Games</button>
        <button class="category-btn" onclick="filterCategory('action', this)">Actie</button>
        <button class="category-btn" onclick="filterCategory('arcade', this)">Arcade</button>
        <button class="category-btn" onclick="filterCategory('puzzle', this)">Puzzel</button>
    </div>

    <!-- Games Overzicht -->
    <div class="main-container">
        <div class="games-grid" id="gamesGrid">
            <!-- Game 1 -->
            <div class="game-card" data-category="action" data-title="space clicker" onclick="openGame('clicker')">
                <div class="game-thumbnail" style="background: #ec4899;">🚀</div>
                <div class="game-info"><div class="game-title">Space Clicker</div></div>
            </div>
            <!-- Game 2 -->
            <div class="game-card" data-category="arcade" data-title="retro snake" onclick="openGame('snake')">
                <div class="game-thumbnail" style="background: #10b981;">🐍</div>
                <div class="game-info"><div class="game-title">Retro Snake</div></div>
            </div>
            <!-- Game 3 -->
            <div class="game-card" data-category="puzzle" data-title="geheugenspel" onclick="openGame('memory')">
                <div class="game-thumbnail" style="background: #f59e0b;">🧠</div>
                <div class="game-info"><div class="game-title">Geheugenspel</div></div>
            </div>
            <!-- Game 4 -->
            <div class="game-card" data-category="action" data-title="reactietest" onclick="openGame('reaction')">
                <div class="game-thumbnail" style="background: #ef4444;">⚡</div>
                <div class="game-info"><div class="game-title">Reactietest</div></div>
            </div>
        </div>
    </div>

    <!-- Het Pop-up Speelscherm (Modal) -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame()">&times;</span>
            <div class="game-window" id="gameWindow">
                <!-- Dynamische game elementen verschijnen hier -->
            </div>
        </div>
    </div>

    <script>
        // --- PORTAL INTERFACES LOGICA ---
        function searchGames() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function filterCategory(category, button) {
            let cards = document.getElementsByClassName('game-card');
            let buttons = document.getElementsByClassName('category-btn');
            
            for (let b of buttons) b.classList.remove('active');
            if (button) button.classList.add('active');

            for (let i = 0; i < cards.length; i++) {
                let cat = cards[i].getAttribute('data-category');
                if (category === 'all' || cat === category) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // --- LIVE GAME RUNNERS ---
        let currentInterval = null;

        function openGame(gameId) {
            const windowEl = document.getElementById('gameWindow');
            windowEl.innerHTML = ""; // Reset venster
            document.getElementById('gameModal').style.display = "flex";

            if (gameId === 'clicker') {
                let score = 0;
                windowEl.innerHTML = `
                    <div style="text-align:center;">
                        <h2 style="margin-bottom:15px;" id="cScore">Score: 0</h2>
                        <button class="arcade-btn" id="clickBtn">🚀 KLIK!</button>
                    </div>`;
