<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdemChat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#dfe5e8;
  height:100vh;
}

.app{
  width:100%;
  max-width:520px;
  height:100vh;
  margin:auto;
  background:white;
  overflow:hidden;
  position:relative;
}

/* START */

#start{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px;
}

.logo{
  font-size:42px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#00a884;
}

.start-text{
  color:#777;
  margin-bottom:30px;
  text-align:center;
}

.username{
  display:flex;
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:10px;
}

.username b{
  background:#eee;
  padding:15px;
}

.username input{
  flex:1;
  border:0;
  outline:0;
  padding:15px;
  font-size:16px;
}

.green{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#00a884;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* HOME */

#home{
  display:none;
  height:100%;
  flex-direction:column;
}

.top{
  background:#008f72;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.top h2{
  font-size:22px;
}

.top button{
  background:transparent;
  border:0;
  color:white;
  font-size:24px;
  margin-left:12px;
  cursor:pointer;
}

.search{
  padding:9px;
  background:#f0f2f5;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  padding:12px;
  border-radius:10px;
  background:white;
}

.list{
  flex:1;
  overflow:auto;
}

.item{
  display:flex;
  align-items:center;
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.item:hover{
  background:#f5f5f5;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#00a884;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  margin-right:13px;
}

.info{
  flex:1;
}

.info strong{
  display:block;
  margin-bottom:5px;
}

.info small{
  color:#777;
}

/* CHAT */

#chat{
  display:none;
  height:100%;
  flex-direction:column;
}

.chat-top{
  background:#008f72;
  color:white;
  padding:11px;
  display:flex;
  align-items:center;
}

.back{
  border:0;
  background:transparent;
  color:white;
  font-size:30px;
  margin-right:10px;
}

.chat-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#00a884;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:10px;
}

.chat-title strong{
  display:block;
}

.chat-title small{
  opacity:.85;
}

.messages{
  flex:1;
  overflow:auto;
  padding:15px;
  background:#efe7dd;
}

.msg{
  max-width:78%;
  padding:9px 11px;
  background:white;
  border-radius:9px;
  margin-bottom:8px;
  word-wrap:break-word;
}

.msg.me{
  margin-left:auto;
  background:#d9ffc7;
}

.msg small{
  display:block;
  text-align:right;
  color:#777;
  font-size:10px;
  margin-top:4px;
}

.write{
  display:flex;
  gap:7px;
  padding:8px;
  background:#eee;
}

.write input{
  flex:1;
  border:0;
  outline:0;
  border-radius:22px;
  padding:13px;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#00a884;
  color:white;
  font-size:20px;
}

/* MODAL */

.modal{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  background:white;
  width:100%;
  max-width:400px;
  border-radius:16px;
  padding:20px;
}

.box h3{
  margin-bottom:15px;
}

.box input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:10px;
  outline:0;
}

.box button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  margin-top:5px;
  background:#00a884;
  color:white;
  font-weight:bold;
}

.box .cancel{
  background:#ddd;
  color:#222;
}

.error{
  color:#e53935;
  font-size:13px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="app">

<!-- STARTSCHERM -->

<section id="start">

  <div class="logo">
    Edem<span>Chat</span>
  </div>

  <p class="start-text">
    Chat met vrienden en maak groepen.
  </p>

  <div class="username">
    <b>@</b>
    <input
      id="username"
      maxlength="10"
      placeholder="jouw username">
  </div>

  <div id="error" class="error"></div>

  <button class="green" onclick="login()">
    Starten
  </button>

</section>


<!-- HOME -->

<section id="home">

  <div class="top">
    <h2>EdemChat</h2>

    <div>
      <button onclick="addFriend()">＋</button>
      <button onclick="newGroup()">👥</button>
    </div>
  </div>

  <div class="search">
    <input
      id="search"
      placeholder="Zoeken..."
      oninput="search()">
  </div>

  <div id="list" class="list"></div>

</section>


<!-- CHAT -->

<section id="chat">

  <div class="chat-top">

    <button class="back" onclick="backHome()">
      ‹
    </button>

    <div class="chat-avatar" id="chatAvatar">
      👤
    </div>

    <div class="chat-title">
      <strong id="chatName"></strong>
      <small id="chatStatus"></small>
    </div>

  </div>

  <div id="messages" class="messages"></div>

  <div class="write">

    <input
      id="message"
      placeholder="Typ een bericht..."
      onkeydown="if(event.key==='Enter')send()">

    <button class="send" onclick="send()">
      ➤
    </button>

  </div>

</section>


<!-- VRIEND TOEVOEGEN -->

<div id="friendModal" class="modal">

  <div class="box">

    <h3>Vriend toevoegen</h3>

    <input
      id="friend"
      maxlength="10"
      placeholder="@username">

    <button onclick="saveFriend()">
      Toevoegen
    </button>

    <button class="cancel" onclick="closeModals()">
      Annuleren
    </button>

  </div>

</div>


<!-- GROEP -->

<div id="groupModal" class="modal">

  <div class="box">

    <h3>Nieuwe groep</h3>

    <input
      id="groupName"
      maxlength="30"
      placeholder="Groepsnaam">

    <input
      id="members"
      placeholder="@edem, @yassin">

    <button onclick="saveGroup()">
      Groep maken
    </button>

    <button class="cancel" onclick="closeModals()">
      Annuleren
    </button>

  </div>

</div>

<script>

let me = localStorage.getItem("edemchat_user") || "";

let contacts =
JSON.parse(localStorage.getItem("edemchat_contacts") || "[]");

let chats =
JSON.parse(localStorage.getItem("edemchat_chats") || "{}");

let current = "";


/* LOGIN */

function login(){

  let name =
  document.getElementById("username")
  .value.trim();

  name = name.replace(/\s/g,"");

  if(!/^[A-Za-z]{3,10}$/.test(name)){

    document.getElementById("error")
    .innerText =
    "Je username moet 3 tot 10 letters bevatten.";

    return;
  }

  me=name;

  localStorage.setItem(
    "edemchat_user",
    me
  );

  document.getElementById("start")
  .style.display="none";

  document.getElementById("home")
  .style.display="flex";

  render();
}


/* CONTACT TOEVOEGEN */

function addFriend(){

  document.getElementById("friendModal")
  .style.display="flex";
}

function saveFriend(){

  let name =
  document.getElementById("friend")
  .value.trim()
  .replace("@","");

  if(!/^[A-Za-z]{3,10}$/.test(name)){
    alert("Gebruik 3 tot 10 letters.");
    return;
  }

  if(name.toLowerCase() === me.toLowerCase()){
    alert("Je kunt jezelf niet toevoegen.");
    return;
  }

  if(!contacts.includes(name)){
    contacts.push(name);
  }

  save();

  closeModals();

  document.getElementById("friend").value="";

  render();
}


/* GROEP */

function newGroup(){

  document.getElementById("groupModal")
  .style.display="flex";
}

function saveGroup(){

  let name =
  document.getElementById("groupName")
  .value.trim();

  let members =
  document.getElementById("members")
  .value
  .split(",")
  .map(x=>x.trim().replace("@",""))
  .filter(Boolean);

  if(!name){
    alert("Geef je groep een naam.");
    return;
  }

  let id =
  "group_" + Date.now();

  chats[id]={
    name:name,
    group:true,
    members:members,
    messages:[]
  };

  save();

  closeModals();

  render();
}


/* LIJST */

function render(){

  let list =
  document.getElementById("list");

  list.innerHTML="";

  contacts.forEach(name=>{

    createItem(
      name,
      "@"+name,
      name
    );

  });

  Object.keys(chats).forEach(id=>{

    let group=chats[id];

    if(group.group){

      createItem(
        id,
        "👥 "+group.name,
        group.members.length+" leden"
      );

    }

  });

}


/* ITEM */

function createItem(id,title,sub){

  let list =
  document.getElementById("list");

  let item =
  document.createElement("div");

  item.className="item";

  item.dataset.search =
  (title+" "+sub).toLowerCase();

  item.innerHTML=`

    <div class="avatar">
      ${title.startsWith("👥")
      ?"👥"
      :title.replace("@","").charAt(0).toUpperCase()}
    </div>

    <div class="info">
      <strong>${title}</strong>
      <small>${sub}</small>
    </div>

  `;

  item.onclick=()=>openChat(id);

  list.appendChild(item);
}


/* CHAT OPENEN */

function openChat(id){

  current=id;

  document.getElementById("home")
  .style.display="none";

  document.getElementById("chat")
  .style.display="flex";

  let isGroup =
  chats[id] && chats[id].group;

  if(isGroup){

    document.getElementById("chatName")
    .innerText=chats[id].name;

    document.getElementById("chatAvatar")
    .innerText="👥";

    document.getElementById("chatStatus")
    .innerText=
    chats[id].members.length+" leden";

  }else{

    document.getElementById("chatName")
    .innerText="@"+id;

    document.getElementById("chatAvatar")
    .innerText=
    id.charAt(0).toUpperCase();

    document.getElementById("chatStatus")
    .innerText="contact";

  }

  showMessages();
}


/* BERICHTEN TONEN */

function showMessages(){

  let box =
  document.getElementById("messages");

  box.innerHTML="";

  let data =
  getMessages();

  data.forEach(msg=>{

    let div =
    document.createElement("div");

    div.className=
    "msg "+(msg.user===me?"me":"");

    div.innerHTML=`
      ${escapeHtml(msg.text)}
      <small>@${escapeHtml(msg.user)}</small>
    `;

    box.appendChild(div);

  });

  box.scrollTop=box.scrollHeight;
}


/* BERICHT STUREN */

function send(){

  let input =
  document.getElementById("message");

  let text =
  input.value.trim();

  if(!text)return;

  let data =
  getMessages();

  data.push({
    user:me,
    text:text,
    time:Date.now()
  });

  setMessages(data);

  input.value="";

  showMessages();
}


/* BERICHT DATA */

function getMessages(){

  if(chats[current] &&
     chats[current].group){

    return chats[current].messages || [];

  }

  return chats[current] || [];
}


function setMessages(data){

  if(chats[current] &&
     chats[current].group){

    chats[current].messages=data;

  }else{

    chats[current]=data;

  }

  save();
}


/* TERUG */

function backHome(){

  document.getElementById("chat")
  .style.display="none";

  document.getElementById("home")
  .style.display="flex";

  current="";
}


/* ZOEKEN */

function search(){

  let q =
  document.getElementById("search")
  .value.toLowerCase();

  document.querySelectorAll(".item")
  .forEach(item=>{

    item.style.display =
    item.dataset.search.includes(q)
    ?"flex"
    :"none";

  });
}


/* MODALS */

function closeModals(){

  document.getElementById("friendModal")
  .style.display="none";

  document.getElementById("groupModal")
  .style.display="none";
}


/* OPSLAAN */

function save(){

  localStorage.setItem(
    "edemchat_contacts",
    JSON.stringify(contacts)
  );

  localStorage.setItem(
    "edemchat_chats",
    JSON.stringify(chats)
  );
}


/* VEILIG TEKST WEERGEVEN */

function escapeHtml(text){

  return text
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* AUTOMATISCH OPENEN */

if(me){

  document.getElementById("start")
  .style.display="none";

  document.getElementById("home")
  .style.display="flex";

  render();

}

</script>

</div>

</body>
</html>
