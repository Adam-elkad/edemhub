<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdemGames - Retro Snake Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #5c3bc4;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SCHERM 1: HOMEPAGE PORTAL --- */
        #portalScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #5c3bc4;
        }

        header {
            background: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #5c3bc4;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .logo span {
            background: #ffcc00;
            color: black;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 4px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
            background: #2bd980;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        .game-thumbnail {
            font-size: 55px;
            margin-bottom: 8px;
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            color: black;
        }

        /* --- SCHERM 2: ZWART SPEELPLATFORM --- */
        #snakePlatform {
            position: absolute;
            inset: 0;
            background: #000000; /* Volledig zwart scherm */
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .top-navigation {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .backspace-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b91c1c;
            text-transform: uppercase;
        }

        .backspace-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b91c1c;
        }

        .score-counter {
            font-size: 22px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            display: none; 
        }

        /* Menu teksten midden op het zwarte scherm */
        .game-menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .menu-item-text {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.15s, color 0.15s;
            text-transform: uppercase;
        }

        #playBtn { color: #2bd980; }
        #skinsBtn { color: #2cc9f3; }
        #fruitBtn { color: #ff5376; }

        .menu-item-text:hover {
            transform: scale(1.1);
        }

        /* 20x20 Schaakbord Canvas */
        #snakeCanvas {
            background: #1e293b;
            border: 4px solid #334155;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(255,255,255,0.05);
            display: none; 
        }
    </style>
</head>
<body>

    <!-- SCHERM 1: HOMEPAGE ARCADE -->
    <div id="portalScreen">
        <header>
            <div class="logo">Poki<span>Hub</span></div>
            <div style="font-weight: bold; color: black; background: #ffcc00; padding: 5px 12px; border-radius: 15px;">Edem's Arcade</div>
        </header>

        <div class="main-container">
            <div class="games-grid">
                <div class="game-card" onclick="switchToSnakePlatform()">
                    <div class="game-thumbnail">🐍</div>
                    <div class="game-info"><div class="game-title">Retro Snake</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCHERM 2: APART ZWART PLATFORM -->
    <div id="snakePlatform">
        <div class="top-navigation">
            <button class="backspace-btn" onclick="returnToHomePortal()">⬅ TERUG</button>
            <div class="score-counter" id="gameScoreContainer">SCORE: <span id="liveScore">0</span></div>
        </div>

        <!-- Menu teksten -->
        <div class="game-menu-container" id="mainGameMenu">
            <div class="menu-item-text" id="playBtn" onclick="selectMenuOption('play')">PLAY</div>
            <div class="menu-item-text" id="skinsBtn" onclick="selectMenuOption('skins')">SKINS</div>
            <div class="menu-item-text" id="fruitBtn" onclick="selectMenuOption('fruit')">FRUIT</div>
        </div>

        <!-- Het 20x20 Schaakbord -->
        <canvas id="snakeCanvas" width="360" height="360"></canvas>
    </div>

    <script>
        let runtimeLoopTicker = null;
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        
        // Exact 20x20 vakjes (360px breedte / 20 = 18px per vakje)
        const gridSizeUnits = 20;
        const cellPixelDimension = 18;

        let snakeCoordinates = [];
        let activeApple = { x: 0, y: 0 };
        let vectorX = 1;
        let vectorY = 0;
        let scoreTracker = 0;

        // GA NAAR HET ZWARTE SCHERM
        function switchToSnakePlatform() {
            document.getElementById("portalScreen").style.display = "none";
            document.getElementById("snakePlatform").style.display = "flex";
            
            // Toon altijd eerst het menu als je binnenkomt
            document.getElementById("mainGameMenu").style.display = "flex";
            document.getElementById("snakeCanvas").style.display = "none";
            document.getElementById("gameScoreContainer").style.display = "none";
        }

        // TERUG NAAR HOMEPAGE
        function returnToHomePortal() {
            if (runtimeLoopTicker) {
                clearInterval(runtimeLoopTicker);
                runtimeLoopTicker = null;
            }
            window.onkeydown = null;

            document.getElementById("snakePlatform").style.display = "none";
            document.getElementById("portalScreen").style.display = "flex";
        }

        // COORDINEER MENU OPTIES
        function selectMenuOption(option) {
            if (option === 'play') {
                // Verberg menu, toon het bord en de score
                document.getElementById("mainGameMenu").style.display = "none";
                document.getElementById("snakeCanvas").style.display = "block";
                document.getElementById("gameScoreContainer").style.display = "block";
                
                // Start direct met spelen!
                launchChessboardEngine();
            } else if (option === 'skins') {
                alert("Skins menu openen...");
            } else if (option === 'fruit') {
                alert("Fruit instellingen openen...");
            }
        }

        // SNAKE ENGINE STARTEN
        function launchChessboardEngine() {
            if (runtimeLoopTicker) clearInterval(runtimeLoopTicker);
            
            scoreTracker = 0;
            document.getElementById("liveScore").innerText = scoreTracker;
            
            // Anatomie setup: hoofd + 1 body segment
            snakeCoordinates = [
                { x: 10, y: 10 },
                { x: 9, y: 10 }
            ];
            
            vectorX = 1;
            vectorY = 0;

            generateRandomApplePosition();

            // Toetsenbord koppelen
            window.onkeydown = function(e) {
                if (e.key === "ArrowLeft" && vectorX === 0)  { vectorX = -1; vectorY = 0; }
                if (e.key === "ArrowRight" && vectorX === 0) { vectorX = 1;  vectorY = 0; }
                if (e.key === "ArrowUp" && vectorY === 0)    { vectorX = 0;  vectorY = -1; }
                if (e.key === "ArrowDown" && vectorY === 0)  { vectorX = 0;  vectorY = 1; }
            };

            runtimeLoopTicker = setInterval(processEngineFrameUpdate, 130);
        }

        function generateRandomApplePosition() {
            activeApple.x = Math.floor(Math.random() * gridSizeUnits);
            activeApple.y = Math.floor(Math.random() * gridSizeUnits);
