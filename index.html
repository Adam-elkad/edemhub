<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pro - Edem Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #d1d7db; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* --- SCHERM 1: EXTRA LANGE INLOG OVERLAY --- */
        #loginOverlay {
            position: absolute;
            inset: 0;
            background-color: #111b21; /* Donkere WhatsApp stijl */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background-color: #222e35;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 460px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid #2f3b43;
        }

        .login-box h2 {
            color: #e9edef;
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .input-container-box {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
        }

        /* Extra lange invulbalk met @ aan het begin */
        .login-input {
            width: 100%;
            background-color: #2a3942;
            border: 2px solid #3d4c55;
            padding: 14px 16px 14px 40px; 
            border-radius: 10px;
            color: #e9edef;
            font-size: 16px;
            outline: none;
            font-weight: bold;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: #00a884;
        }

        .input-container-box::before {
            content: "@";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #00a884;
            font-size: 20px;
            font-weight: 900;
        }

        .login-btn {
            background-color: #00a884;
            color: #111b21;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover { 
            background-color: #008f68; 
            transform: translateY(-1px);
        }

        /* --- SCHERM 2: WHATSAPP INTERFACE (VERBORGEN TOT INLOG) --- */
        #whatsappContainer {
            display: none; /* Wordt pas flex na inloggen */
            width: 100%;
            max-width: 1396px;
            height: 95vh;
            background-color: #ffffff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        /* LINKERKOLOM */
        .sidebar {
            width: 35%;
            max-width: 400px;
            min-width: 300px;
            background-color: #ffffff;
            border-right: 1px solid #e9edef;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 60px;
            background-color: #f0f2f5;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e9edef;
        }

        .my-avatar {
            width: 40px;
            height: 40px;
            background-color: #00a884;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
            text-transform: uppercase;
        }

        .my-name {
            font-weight: bold;
            color: #111b21;
            font-size: 15px;
        }

        /* BALK OM MENSEN OF GROEPEN TOE TE VOEGEN */
        .add-friend-bar {
            padding: 12px 14px;
            background-color: #fff;
            border-bottom: 1px solid #e9edef;
            display: flex;
            gap: 8px;
        }

        .add-friend-input {
            flex: 1;
            background-color: #f0f2f5;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            color: #111b21;
        }

        .add-friend-btn {
            background-color: #00a884;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-friend-btn:hover { background-color: #008f68; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0f2f5;
            transition: background 0.1s;
        }

        .chat-item:hover { background-color: #f0f2f5; }
        .chat-item.active { background-color: #eaebeb; }

        .friend-avatar {
            width: 45px;
            height: 45px;
            background-color: #53bdeb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-right: 15px;
            color: white;
            font-weight: bold;
        }

        .chat-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .chat-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .friend-name {
            font-size: 16px;
            font-weight: 500;
            color: #111b21;
        }

        .chat-time {
            font-size: 12px;
            color: #667781;
        }

        .last-msg {
            font-size: 13px;
            color: #667781;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* RECHTERKOLOM: CHATSCHERM */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #efeae2; 
            position: relative;
        }

        #emptyState {
            position: absolute;
            inset: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        #emptyState h2 { color: #41525d; font-weight: 300; margin-bottom: 10px; }
        #emptyState p { color: #667781; font-size: 14px; }

        .chat-header {
            height: 60px;
            background-color: #f0f2f5;
            padding: 10px 16px;
            display: none; 
            align-items: center;
            border-bottom: 1px solid #e9edef;
        }

        .chat-header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-text { font-size: 13px; color: #667781; }

        .messages-area {
            flex: 1;
            padding: 20px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            max-width: 65%;
            padding: 8px 12px 24px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            color: #111b21;
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
            user-select: text;
        }

        .msg-bubble.sent {
            background-color: #d9fdd3; 
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .msg-bubble.received {
            background-color: #ffffff; 
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .msg-time {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 11px;
            color: #667781;
        }

        .input-bar {
            height: 62px;
            background-color: #f0f2f5;
            padding: 10px 24px;
            display: none; 
            align-items: center;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            background-color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            color: #111b21;
        }

        .send-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #00a884;
        }
    </style>
</head>
<body>

    <!-- SCHERM 1: DE INTRO-VRAAG (START OVERLAY) -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Wat is je username?</h2>
