<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Game Portal - 100% Werkend</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #000000;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SCHERM 1: ROBLOX HOMEPAGE --- */
        #robloxHome {
            position: absolute;
            inset: 0;
            background: #111827;
            display: flex;
            flex-direction: column;
            transition: opacity 0.2s;
        }

        header {
            background: #1f2937;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #374151;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo .icon-block {
            width: 24px;
            height: 24px;
            background: #ffffff;
            transform: rotate(-5deg);
            border-radius: 4px;
            position: relative;
        }

        .logo .icon-block::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #1f2937;
            top: 8px;
            left: 8px;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: #1f2937;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: 2px solid #374151;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #0084ff;
            box-shadow: 0 10px 20px rgba(0,84,255,0.2);
        }

        .game-banner {
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
        }

        .game-info {
            padding: 12px;
            background: rgba(0,0,0,0.2);
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-rating {
            font-size: 12px;
            color: #10b981;
            margin-top: 4px;
            font-weight: bold;
        }

        /* --- SCHERM 2: ACTIVE GAME WINDOW & LOADER --- */
        #gameWindow {
            position: absolute;
            inset: 0;
            background: #000000;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        #robloxLoader {
            position: absolute;
            inset: 0;
            background: #191b1d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1010;
        }

        .roblox-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #222;
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-top-bar {
            background: #191b1d;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d3035;
            height: 55px;
        }

        .leave-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b91c1c;
            text-transform: uppercase;
        }

        .leave-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b91c1c; }

        .game-play-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #0c0f1d;
        }

        /* --- IN-GAME HUD ELEMENTEN (CHAT & SCOREBORD) --- */
        .roblox-chat {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 260px;
            height: 150px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }

        .chat-msg { margin-bottom: 4px; }
        .chat-system { color: #ffff00; font-style: italic; }

        .roblox-leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lb-header {
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .lb-row {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        /* --- GAME ENGINE INTERNE MECHANICS --- */
        .health-container {
            width: 260px;
            height: 20px;
            background: #374151;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
            margin-bottom: 15px;
        }

        .health-bar {
            width: 100%;
            height: 100%;
            background: #10b981;
            transition: width 0.1s ease;
        }

        .tycoon-baseplate {
            width: 380px;
            height: 160px;
            background: #4b5563;
            border-radius: 12px;
            border-bottom: 6px solid #374151;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
        }

        .tycoon-item {
            width: 65px;
            height: 65px;
            background: #ef4444;
            border-radius: 10px;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            border-bottom: 5px solid #b91c1c;
        }

        .tycoon-shop {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .tycoon-btn {
            background: #1f2937;
            border: 2px solid #374151;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .tycoon-btn.bought { opacity: 0.4; pointer-events: none; }

        .arcade-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #047857;
            text-transform: uppercase;
        }
        .arcade-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }
    </style>
</head>
<body>

    <!-- SCHERM 1: ROBLOX PORTAL HUB -->
    <div id="robloxHome">
        <header>
            <div class="logo"><div class="icon-block"></div>ROBLOX</div>
            <div style="font-weight: bold; color: #ffcc00; font-size: 16px;">⏣ Robux: <span id="walletRobux">25</span></div>
        </header>

        <div class="main-content">
            <h2>Ontdek Games</h2>
            <div class="games-grid">
                
                <!-- Game 1 -->
                <div class="game-card" onclick="launchRobloxGame('sword')">
                    <div class="game-banner" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">⚔️</div>
                    <div class="game-info">
                        <div class="game-title">Sword Fighting Sim</div>
                        <div class="game-rating">👍 94% | Active</div>
                    </div>
                </div>

                <!-- Game 2 -->
                <div class="game-card" onclick="launchRobloxGame('obby')">
