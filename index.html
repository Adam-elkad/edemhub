<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klik Teller - Feest</title>
    <style>
        /* Basis wit scherm zoals eerst */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        /* De teller boven de knop */
        .teller-container {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
            z-index: 10;
        }

        #teller {
            color: #0078d7;
            font-size: 3.5rem;
            display: block;
            text-align: center;
        }

        /* Grote blauwe knop in het midden */
        .klik-knop {
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background-color: #0078d7;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s, background-color 0.2s;
            z-index: 10;
        }

        .klik-knop:hover { background-color: #005a9e; }
        .klik-knop:active { transform: scale(0.95); }

        /* Het taartscherm bij 999 kliks */
        .taart-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .kaarsjes-box {
            display: flex;
            gap: 15px;
            margin-bottom: -5px;
        }

        .kaars {
            width: 8px;
            height: 35px;
            background: linear-gradient(to bottom, #eab308, #ef4444);
            position: relative;
        }

        .vlam {
            width: 12px;
            height: 18px;
            background: radial-gradient(circle, #ffea00 0%, #ff7b00 100%);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -20px;
            left: -2px;
            animation: flakkeren 0.1s infinite alternate;
            box-shadow: 0 0 10px #ffea00;
        }

        @keyframes flakkeren {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        .taart-emoji {
            font-size: 6rem;
            line-height: 1;
        }

        .blaas-knop {
            margin-top: 25px;
            padding: 15px 35px;
            font-size: 1.2rem;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        /* 500 kliks tril-animatie */
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
        .shake-effect { 
            animation: shake 0.1s infinite; 
            color: #ef4444 !important;
        }

        /* Confetti vallende stukjes */
        .confetti-pop {
            position: absolute;
            font-size: 2rem;
            animation: vliegOmhoog 1.5s forwards ease-out;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes vliegOmhoog {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Hoofdscherm met teller en knop -->
    <div id="hoofdPaneel" style="text-align: center;">
        <div class="teller-container">
            Kliks: <span id="teller">0</span>
        </div>
        <button class="klik-knop" id="hoofdKnop" onclick="verhoogTeller()">Klik hier!</button>
    </div>

    <!-- Taart evenement (spawnt bij 999) -->
    <div class="taart-container" id="taartEvent">
        <div class="kaarsjes-box">
            <div class="kaars"><div class="vlam" id="vlam1"></div></div>
            <div class="kaars"><div class="vlam" id="vlam2"></div></div>
            <div class="kaars"><div class="vlam" id="vlam3"></div></div>
        </div>
        <div class="taart-emoji">🎂</div>
        <button class="blaas-knop" onclick="blaasKaarsjesUit()">BLAAS DE KAARSEN UIT! (KLIK 1000)</button>
    </div>

    <script>
        let aantalKliks = 0;

        function verhoogTeller() {
            aantalKliks++;
            
            const tellerElement = document.getElementById('teller');
            tellerElement.innerText = aantalKliks;

            // 1. Elke 100 kliks confetti (behalve bij 500)
            if (aantalKliks % 100 === 0 && aantalKliks !== 500) {
                lancerenConfetti(15);
            }

            // 2. Bij 500 kliks: teller trilt 3 seconden
            if (aantalKliks === 500) {
                tellerElement.classList.add('shake-effect');
                lancerenConfetti(30);
                setTimeout(() => {
                    tellerElement.classList.remove('shake-effect');
                }, 3000);
            }

            // 3. Bij 999 kliks: scherm wordt zwart en taart verschijnt
            if (aantalKliks === 999) {
                document.body.style.backgroundColor = "#000000";
                document.getElementById('hoofdPaneel').style.display = "none";
                document.getElementById('taartEvent').style.display = "flex";
            }
        }

        function blaasKaarsjesUit() {
            aantalKliks++; // We gaan naar 1000 kliks!
            
            // Doe de kaarsjes uit
            document.getElementById('vlam1').style.display = 'none';
            document.getElementById('vlam2').style.display = 'none';
            document.getElementById('vlam3').style.display = 'none';
            
            // Wacht even, zet het scherm terug op wit en start het mega feest
            setTimeout(() => {
                document.getElementById('taartEvent').style.display = "none";
                document.body.style.backgroundColor = "#ffffff";
                
                const hoofdpaneel = document.getElementById('hoofdPaneel');
                hoofdpaneel.style.display = "block";
                document.getElementById('teller').innerText = "1000";
                
                const knopElement = document.getElementById('hoofdKnop');
                knopElement.innerText = "GEWONNEN! 🎉";
                knopElement.style.backgroundColor = "#e91e63";

                // Non-stop confetti feestregen
                for (let i = 0; i < 60; i++) {
                    setTimeout(() => { lancerenConfetti(5); }, i * 100);
                }
            }, 800);
        }

        // De confetti-maker
        function lancerenConfetti(aantal) {
            const emojis = ['🎉', '✨', '🎈', '🍬', '⭐'];
            for (let i = 0; i < aantal; i++) {
                const p = document.createElement('div');
                p.classList.add('confetti-pop');
                p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                const randomX = (Math.random() - 0.5) * 500 + 'px';
                const randomY = -(Math.random() * 300 + 200) + 'px';
                p.style.setProperty('--x', randomX);
                p.style.setProperty('--y', randomY);
                
                p.style.left = '50%';
                p.style.top = '50%';
                
                document.body.appendChild(p);
                setTimeout(() => { p.remove(); }, 1500);
            }
        }
    </script>
</body>
</html>
