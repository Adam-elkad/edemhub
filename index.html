<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sterren Vanger Game</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 5px; color: #38bdf8; }
        p { margin: 0 0 15px 0; color: #94a3b8; }
        canvas {
            background: #1e293b;
            border: 4px solid #38bdf8;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Sterren Vanger 🌟</h1>
    <p>Gebruik de <b>Pijltjestoetsen (Links / Rechts)</b> om de mand te bewegen!</p>

    <!-- Het speelveld -->
    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game variabelen
        let score = 0;
        let gameOver = false;

        // De speler (het mandje)
        const player = {
            x: 175,
            y: 460,
            width: 60,
            height: 15,
            speed: 7,
            dx: 0
        };

        // De vallende ster
        const star = {
            x: Math.random() * (canvas.width - 20),
            y: 0,
            size: 15,
            speed: 4
        };

        // Toetsenbord besturing registreren
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "Left") player.dx = -player.speed;
            if (e.key === "ArrowRight" || e.key === "Right") player.dx = player.speed;
        });

        document.addEventListener("keyup", (e) => {
            if (["ArrowLeft", "Left", "ArrowRight", "Right"].includes(e.key)) {
                player.dx = 0;
            }
        });

        // Game logica updaten
        function update() {
            if (gameOver) return;

            // Beweeg speler en hou binnen het scherm
            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Beweeg ster naar beneden
            star.y += star.speed;

            // Check of speler de ster vangt
            if (
                star.y + star.size >= player.y &&
                star.x + star.size >= player.x &&
                star.x <= player.x + player.width
            ) {
                score += 1;
                resetStar();
                // Maak het spel telkens een klein beetje sneller
                star.speed += 0.3;
            }

            // Check of ster de grond raakt (Game Over)
            if (star.y > canvas.height) {
                gameOver = true;
            }
        }

        // Ster resetten naar de top
        function resetStar() {
            star.x = Math.random() * (canvas.width - star.size);
            star.y = 0;
        }

        // Alles op het scherm tekenen
        function draw() {
            // Maak canvas leeg
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Teken speler (mandje)
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Teken ster
            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.arc(star.x + star.size/2, star.y + star.size/2, star.size/2, 0, Math.PI * 2);
            ctx.fill();

            // Teken score
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Arial";
            ctx.fillText(`Score: ${score}`, 15, 30);

            // Game over scherm
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Arial";
                ctx.fillText("Ververs de pagina om opnieuw te spelen", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        // De centrale game loop die constant herhaalt
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start het spel
        loop();
    </script>
</body>
</html>
