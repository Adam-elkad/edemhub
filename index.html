<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #e9edf0;
  height: 100vh;
}

.app {
  max-width: 500px;
  height: 100vh;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
}

/* STARTSCHERM */
#login {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  margin-bottom: 10px;
}

.subtitle {
  color: #777;
  margin-bottom: 30px;
}

.username-box {
  width: 100%;
  display: flex;
  border: 1px solid #ccc;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 10px;
}

.username-box span {
  padding: 14px;
  background: #eee;
  font-weight: bold;
}

.username-box input {
  flex: 1;
  border: 0;
  outline: none;
  padding: 14px;
  font-size: 16px;
}

button {
  border: none;
  cursor: pointer;
}

.main-button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
}

/* APP */
#chatApp {
  display: none;
  height: 100%;
  flex-direction: column;
}

header {
  padding: 18px;
  background: #128c7e;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  font-size: 21px;
}

.header-buttons button {
  background: transparent;
  color: white;
  font-size: 23px;
  margin-left: 10px;
}

.search {
  padding: 10px;
  background: #f0f2f5;
}

.search input {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 10px;
  outline: none;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
}

.chat {
  display: flex;
  align-items: center;
  padding: 14px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #128c7e;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-right: 13px;
}

.chat-info {
  flex: 1;
}

.chat-info strong {
  display: block;
  margin-bottom: 5px;
}

.chat-info small {
  color: #777;
}

/* CHAT */
#conversation {
  display: none;
  height: 100%;
  flex-direction: column;
}

.chat-header {
  background: #128c7e;
  color: white;
  padding: 14px;
  display: flex;
  align-items: center;
}

.back {
  font-size: 25px;
  margin-right: 15px;
  background: transparent;
  color: white;
}

.messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  background: #efe7dd;
}

.message {
  max-width: 75%;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: white;
}

.message.me {
  margin-left: auto;
  background: #d9ffc7;
}

.message small {
  display: block;
  font-size: 10px;
  color: #777;
  text-align: right;
}

.message-input {
  display: flex;
  padding: 8px;
  background: #f0f0f0;
}

.message-input input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  margin-right: 7px;
}

.send {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #128c7e;
  color: white;
  font-size: 20px;
}

/* MODALS */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: 90%;
  max-width: 400px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.modal-box h3 {
  margin-bottom: 15px;
}

.modal-box input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  margin-bottom: 10px;
}

.modal-box button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: #128c7e;
  color: white;
  font-weight: bold;
  margin-top: 5px;
}

.close {
  background: #ddd !important;
  color: black !important;
}
</style>
</head>

<body>

<div class="app">

<!-- LOGIN -->
<div id="login">

  <div class="logo">ChatApp</div>
  <div class="subtitle">Maak je eigen account</div>

  <div class="username-box">
    <span>@</span>
    <input
      id="username"
      type="text"
      maxlength="10"
      placeholder="username">
  </div>

  <p id="usernameError"
     style="color:red; margin-bottom:10px;">
  </p>

  <button class="main-button"
          onclick="createAccount()">
    Doorgaan
  </button>

</div>


<!-- HOOFDSCHERM -->
<div id="chatApp">

<header>
  <h2>ChatApp</h2>

  <div class="header-buttons">
    <button onclick="openAddFriend()">＋</button>
    <button onclick="openGroup()">👥</button>
  </div>
</header>

<div class="search">
  <input
    id="search"
    placeholder="Zoeken..."
    oninput="searchChats()">
</div>

<div id="chatList" class="chat-list"></div>

</div>


<!-- CONVERSATIE -->
<div id="conversation">

  <div class="chat-header">
    <button class="back" onclick="closeConversation()">‹</button>

    <div>
      <strong id="conversationName"></strong>
      <div id="conversationStatus"
           style="font-size:12px;">
      </div>
    </div>
  </div>

  <div id="messages" class="messages"></div>

  <div class="message-input">
    <input
      id="messageInput"
      placeholder="Typ een bericht..."
      onkeydown="if(event.key==='Enter') sendMessage()">

    <button class="send"
            onclick="sendMessage()">
      ➤
    </button>
  </div>

</div>


<!-- VRIEND TOEVOEGEN -->
<div id="friendModal" class="modal">

  <div class="modal-box">

    <h3>Vriend toevoegen</h3>

    <input
      id="friendUsername"
      maxlength="10"
      placeholder="@username">

    <button onclick="addFriend()">
      Toevoegen
    </button>

    <button class="close"
            onclick="closeModals()">
      Annuleren
    </button>

  </div>
</div>


<!-- GROEP MAKEN -->
<div id="groupModal" class="modal">

  <div class="modal-box">

    <h3>Nieuwe groep</h3>

    <input
      id="groupName"
      maxlength="30"
      placeholder="Naam van de groep">

    <input
      id="groupMembers"
      placeholder="@user1, @user2">

    <button onclick="createGroup()">
      Groep maken
    </button>

    <button class="close"
            onclick="closeModals()">
      Annuleren
    </button>

  </div>
</div>


<script>

let currentUser = "";
let currentChat = "";

let chats = JSON.parse(
  localStorage.getItem("chats") || "[]"
);

let messages = JSON.parse(
  localStorage.getItem("messages") || "{}"
);


/* ACCOUNT MAKEN */

function createAccount() {

  let username =
    document.getElementById("username")
    .value.trim();

  username = username.replace(/\s/g, "");

  if (!/^[A-Za-z]{3,10}$/.test(username)) {

    document.getElementById("usernameError")
      .innerText =
      "Gebruik 3 tot 10 letters, zonder cijfers of spaties.";

    return;
  }

  currentUser = username;

  localStorage.setItem(
    "currentUser",
    currentUser
  );

  document.getElementById("login")
    .style.display = "none";

  document.getElementById("chatApp")
    .style.display = "flex";

  renderChats();
}


/* VRIEND TOEVOEGEN */

function openAddFriend() {
  document.getElementById("friendModal")
    .style.display = "flex";
}

function addFriend() {

  let username =
    document.getElementById("friendUsername")
    .value.trim()
    .replace("@","");

  if (!/^[A-Za-z]{3,10}$/.test(username)) {
    alert("Username moet 3 tot 10 letters hebben.");
    return;
  }

  if (username.toLowerCase() ===
      currentUser.toLowerCase()) {

    alert("Je kunt jezelf niet toevoegen.");
    return;
  }

  if (!chats.includes(username)) {
    chats.push(username);
  }

  saveChats();
  renderChats();
  closeModals();

  document.getElementById("friendUsername")
    .value = "";
}


/* GROEP */

function openGroup() {
  document.getElementById("groupModal")
    .style.display = "flex";
}

function createGroup() {

  let name =
    document.getElementById("groupName")
    .value.trim();

  let members =
    document.getElementById("groupMembers")
    .value
    .split(",")
    .map(x => x.trim().replace("@",""))
    .filter(x => x.length > 0);

  if (name.length < 1) {
    alert("Geef de groep een naam.");
    return;
  }

  let group = {
    id: "group_" + Date.now(),
    name: name,
    members: members,
    group: true
  };

  chats.push(group);

  saveChats();
  renderChats();
  closeModals();

  document.getElementById("groupName").value = "";
  document.getElementById("groupMembers").value = "";
}


/* CHATLIJST */

function renderChats() {

  let list =
    document.getElementById("chatList");

  list.innerHTML = "";

  chats.forEach(chat => {

    let isGroup =
      typeof chat === "object";

    let name =
      isGroup ? chat.name : "@" + chat;

    let avatar =
      isGroup
      ? "👥"
      : chat.substring(0,1).toUpperCase();

    let div =
      document.createElement("div");

    div.className = "chat";

    div.innerHTML = `
      <div class="avatar">${avatar}</div>

      <div class="chat-info">
        <strong>${name}</strong>
        <small>
          ${isGroup
            ? chat.members.length + " leden"
            : "Tik om te chatten"}
        </small>
      </div>
    `;

    div.onclick = () =>
      openConversation(chat);

    list.appendChild(div);
  });
}


/* CONVERSATIE OPENEN */

function openConversation(chat) {

  currentChat =
    typeof chat === "object"
    ? chat.id
    : chat;

  let name =
    typeof chat === "object"
    ? chat.name
    : "@" + chat;

  document.getElementById("chatApp")
    .style.display = "none";

  document.getElementById("conversation")
    .style.display = "flex";

  document.getElementById("conversationName")
    .innerText = name;

  document.getElementById("conversationStatus")
    .innerText =
    typeof chat === "object"
    ? chat.members.length + " leden"
    : "online";

  renderMessages();
}


/* BERICHTEN */

function renderMessages() {

  let box =
    document.getElementById("messages");

  box.innerHTML = "";

  let chatMessages =
    messages[currentChat] || [];

  chatMessages.forEach(msg => {

    let div =
      document.createElement("div");

    div.className =
      "message " +
      (msg.user === currentUser
        ? "me"
        : "");

    div.innerHTML = `
      ${msg.text}
      <small>${msg.user}</small>
    `;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}


/* BERICHT STUREN */

function sendMessage() {

  let input =
    document.getElementById("messageInput");

  let text =
    input.value.trim();

  if (!text) return;

  if (!messages[currentChat]) {
    messages[currentChat] = [];
  }

  messages[currentChat].push({
    user: currentUser,
    text: text,
    time: Date.now()
  });

  localStorage.setItem(
    "messages",
    JSON.stringify(messages)
  );

  input.value = "";

  renderMessages();
}


/* TERUG */

function closeConversation() {

  document.getElementById("conversation")
    .style.display = "none";

  document.getElementById("chatApp")
    .style.display = "flex";

  currentChat = "";
}


/* MODALS */

function closeModals() {

  document.getElementById("friendModal")
    .style.display = "none";

  document.getElementById("groupModal")
    .style.display = "none";
}


/* ZOEKEN */

function searchChats() {

  let query =
    document.getElementById("search")
    .value
    .toLowerCase();

  let items =
    document.querySelectorAll(".chat");

  items.forEach(item => {

    item.style.display =
      item.innerText
      .toLowerCase()
      .includes(query)
      ? "flex"
      : "none";
  });
}


/* OPSLAAN */

function saveChats() {

  localStorage.setItem(
    "chats",
    JSON.stringify(chats)
  );
}


/* AUTOMATISCH INLOGGEN */

window.onload = function() {

  let saved =
    localStorage.getItem("currentUser");

  if (saved) {

    currentUser = saved;

    document.getElementById("login")
      .style.display = "none";

    document.getElementById("chatApp")
      .style.display = "flex";

    renderChats();
  }
};

</script>

</div>

</body>
</html>
