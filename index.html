<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Game Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #000000;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- INTERFACE 1: ROBLOX HOMEPAGE --- */
        #robloxHome {
            position: absolute;
            inset: 0;
            background: #111827;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1f2937;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #374151;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo .icon-block {
            width: 24px;
            height: 24px;
            background: #ef4444;
            transform: rotate(15deg);
            border-radius: 4px;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: #1f2937;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: 2px solid #374151;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #ef4444;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .game-banner {
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
        }

        .game-info {
            padding: 12px;
            background: rgba(0,0,0,0.2);
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-rating {
            font-size: 12px;
            color: #10b981;
            margin-top: 4px;
            font-weight: bold;
        }

        /* --- INTERFACE 2: GAME SCREEN & ROBLOX LAADSCHERM --- */
        #gameWindow {
            position: absolute;
            inset: 0;
            background: #000000;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        #robloxLoader {
            position: absolute;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1010;
        }

        .roblox-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #222;
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-top-bar {
            background: #111;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .leave-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b91c1c;
            text-transform: uppercase;
        }

        .leave-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b91c1c; }

        .game-play-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- GEDEELDE ARCADE BUTTON STYLING --- */
        .arcade-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #047857;
            text-transform: uppercase;
        }
        .arcade-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }
    </style>
</head>
<body>

    <!-- INTERFACE 1: ROBLOX HOMEPAGE -->
    <div id="robloxHome">
        <header>
            <div class="logo"><div class="icon-block"></div>ROBLOX</div>
            <div style="font-weight: bold; color: #ffcc00; font-size: 16px;">💰 Robux: <span id="walletRobux">25</span></div>
        </header>

        <div class="main-content">
            <h2>Ontdek Games</h2>
            <div class="games-grid">
                
                <!-- Game 1 Card -->
                <div class="game-card" onclick="launchRobloxGame('sword')">
                    <div class="game-banner" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">⚔️</div>
                    <div class="game-info">
                        <div class="game-title">Sword Fighting Sim</div>
                        <div class="game-rating">👍 94% | Active</div>
                    </div>
                </div>

                <!-- Game 2 Card -->
                <div class="game-card" onclick="launchRobloxGame('obby')">
                    <div class="game-banner" style="background: linear-gradient(135deg, #f97316, #ea580c);">🏎️</div>
                    <div class="game-info">
                        <div class="game-title">Speed Run Obby</div>
                        <div class="game-rating">👍 89% | Active</div>
                    </div>
                </div>

                <!-- Game 3 Card -->
                <div class="game-card" onclick="launchRobloxGame('tycoon')">
                    <div class="game-banner" style="background: linear-gradient(135deg, #10b981, #047857);">💎</div>
                    <div class="game-info">
                        <div class="game-title">Robux Tycoon</div>
                        <div class="game-rating">👍 91% | Active</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- INTERFACE 2: GAME CLIENT WINDOW -->
    <div id="gameWindow">
        <!-- Roblox laadscherm -->
        <div id="robloxLoader">
            <div class="roblox-spinner"></div>
            <h2 style="letter-spacing: 1px;">JOINING SERVER...</h2>
        </div>

        <div class="game-top-bar">
            <h3 id="gameActiveTitle" style="color: #ffcc00;">Roblox Game</h3>
            <button class="leave-btn" onclick="leaveRobloxGame()">Leave Game</button>
        </div>
        <div class="game-play-area" id="gameEnginePlayground">
            <!-- Mini-games worden hier geladen -->
        </div>
    </div>

    <script>
        let tycoonInterval = null;
        let obbyInterval = null;
        let globalRobux = 25;

        function launchRobloxGame(gameId) {
            document.getElementById("robloxHome").style.opacity = "0.2";
            document.getElementById("gameWindow").style.display = "flex";
            document.getElementById("robloxLoader").style.display = "flex";

            let title = "Roblox Simulator";
            if (gameId === 'sword') title = "⚔️ Sword Fighting Simulator";
            if (gameId === 'obby') title = "🏎️ Speed Run Obby";
            if (gameId === 'tycoon') title = "💎 Robux Tycoon";
            document.getElementById("gameActiveTitle").innerText = title;

            // Roblox laadscherm vertraging van 1 seconde
            setTimeout(() => {
                document.getElementById("robloxLoader").style.display = "none";
                buildActiveGame(gameId);
            }, 1000);
        }

        function leaveRobloxGame() {
            document.getElementById("gameWindow").style.display = "none";
            document.getElementById("robloxHome").style.opacity = "1";
            document.getElementById("gameEnginePlayground").innerHTML = "";
            window.onkeydown = null;

            if (tycoonInterval) clearInterval(tycoonInterval);
            if (obbyInterval) clearInterval(obbyInterval);
            document.getElementById("walletRobux").innerText = globalRobux;
        }

        // --- GAME BUILDER ENGINE ---
        function buildActiveGame(gameId) {
            const container = document.getElementById("gameEnginePlayground");
            container.innerHTML = "";

            // --- 1. SWORD FIGHTING SIMULATOR ---
            if (gameId === 'sword') {
                let clicks = 0;
                let weapon = "Houten Zwaard";
                container.innerHTML = `
                    <div style="text-align:center;">
