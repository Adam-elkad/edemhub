<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdemTok</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #000;
  color: white;
  overflow: hidden;
}

/* APP */
#app {
  height: 100vh;
  width: 100%;
  position: relative;
}

/* TOP */
.top {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 65px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.75),
    transparent
  );
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: #ff0050;
}

/* FEED */
#feed {
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}

#feed::-webkit-scrollbar {
  display: none;
}

.video-card {
  height: 100vh;
  width: 100%;
  position: relative;
  scroll-snap-align: start;
  background: #111;
  overflow: hidden;
}

.video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #111;
}

/* GRADIENT */
.video-card::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    transparent 45%,
    rgba(0,0,0,.15) 60%,
    rgba(0,0,0,.8) 100%
  );
}

/* INFO */
.info {
  position: absolute;
  left: 15px;
  bottom: 85px;
  z-index: 5;
  max-width: 72%;
}

.username {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 8px;
}

.caption {
  font-size: 15px;
  line-height: 1.4;
}

/* BUTTONS */
.actions {
  position: absolute;
  right: 12px;
  bottom: 100px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

.action {
  border: none;
  background: transparent;
  color: white;
  cursor: pointer;
  font-size: 30px;
  text-align: center;
}

.action small {
  display: block;
  font-size: 12px;
  margin-top: 3px;
}

.like.active {
  color: #ff0050;
}

/* BOTTOM NAV */
.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  z-index: 30;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(0,0,0,.85);
  border-top: 1px solid #333;
}

.nav-btn {
  border: none;
  background: transparent;
  color: white;
  font-size: 12px;
  cursor: pointer;
}

.nav-btn span {
  display: block;
  font-size: 23px;
  margin-bottom: 2px;
}

.upload {
  background: white;
  color: black;
  width: 48px;
  height: 34px;
  border-radius: 9px;
  font-size: 25px;
  line-height: 30px;
}

/* MODALS */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.75);
}

.modal.show {
  display: flex;
}

.box {
  width: 90%;
  max-width: 430px;
  background: #181818;
  border-radius: 18px;
  padding: 22px;
  max-height: 85vh;
  overflow-y: auto;
}

.box h2 {
  margin-bottom: 18px;
}

input,
textarea {
  width: 100%;
  background: #292929;
  border: 1px solid #444;
  color: white;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  outline: none;
}

textarea {
  resize: none;
  height: 90px;
}

.main-btn {
  width: 100%;
  border: none;
  background: #ff0050;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

.close {
  float: right;
  background: transparent;
  color: white;
  border: none;
  font-size: 24px;
  cursor: pointer;
}

/* COMMENTS */
.comment {
  padding: 10px 0;
  border-bottom: 1px solid #333;
}

.comment b {
  color: #fff;
}

/* SEARCH */
#searchResults {
  margin-top: 15px;
}

.result {
  padding: 12px;
  background: #252525;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
}

/* EMPTY */
.empty {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
}

.empty h1 {
  font-size: 30px;
  margin-bottom: 10px;
}

.empty p {
  color: #aaa;
}
</style>
</head>

<body>

<div id="app">

  <div class="top">
    <div class="logo">Edem<span>Tok</span></div>
  </div>

  <main id="feed"></main>

  <nav class="bottom">
    <button class="nav-btn" onclick="goHome()">
      <span>⌂</span>
      Home
    </button>

    <button class="nav-btn" onclick="openSearch()">
      <span>🔎</span>
      Zoeken
    </button>

    <button class="nav-btn upload" onclick="openUpload()">
      +
    </button>

    <button class="nav-btn" onclick="openProfile()">
      <span>👤</span>
      Profiel
    </button>
  </nav>

</div>


<!-- UPLOAD MODAL -->
<div class="modal" id="uploadModal">
  <div class="box">
    <button class="close" onclick="closeModal('uploadModal')">×</button>

    <h2>Video toevoegen</h2>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <input
      id="videoUsername"
      maxlength="20"
      placeholder="Je gebruikersnaam"
    >

    <textarea
      id="videoCaption"
      maxlength="150"
      placeholder="Schrijf een beschrijving..."
    ></textarea>

    <button class="main-btn" onclick="addVideo()">
      Video plaatsen
    </button>
  </div>
</div>


<!-- COMMENTS MODAL -->
<div class="modal" id="commentsModal">
  <div class="box">
    <button class="close" onclick="closeModal('commentsModal')">×</button>

    <h2>Reacties</h2>

    <div id="commentsList"></div>

    <input
      id="commentInput"
      maxlength="100"
      placeholder="Schrijf een reactie..."
    >

    <button class="main-btn" onclick="sendComment()">
      Reageren
    </button>
  </div>
</div>


<!-- SEARCH MODAL -->
<div class="modal" id="searchModal">
  <div class="box">
    <button class="close" onclick="closeModal('searchModal')">×</button>

    <h2>Zoeken 🔎</h2>

    <input
      id="searchInput"
      placeholder="Zoek gebruiker of beschrijving..."
      oninput="searchVideos()"
    >

    <div id="searchResults"></div>
  </div>
</div>


<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">
  <div class="box">
    <button class="close" onclick="closeModal('profileModal')">×</button>

    <h2>👤 Mijn profiel</h2>

    <input
      id="profileName"
      maxlength="20"
      placeholder="Je gebruikersnaam"
    >

    <button class="main-btn" onclick="saveProfile()">
      Profiel opslaan
    </button>

    <br><br>

    <p id="profileStats"></p>
  </div>
</div>


<script>

let videos = [];
let currentVideoIndex = null;
let currentCommentVideo = null;


/* =========================
   DATA LADEN
========================= */

function loadData() {

  const saved = localStorage.getItem("edemTokVideos");

  if (saved) {
    videos = JSON.parse(saved);
  }

  renderFeed();
}


/* =========================
   DATA OPSLAAN
========================= */

function saveData() {

  /*
    Video-bestanden zelf kunnen niet zomaar
    in localStorage worden opgeslagen.

    Daarom bewaren we hier likes,
    reacties en informatie.
  */

  const cleanVideos = videos.map(v => ({
    id: v.id,
    username: v.username,
    caption: v.caption,
    likes: v.likes,
    liked: v.liked,
    comments: v.comments,
    demo: v.demo
  }));

  localStorage.setItem(
    "edemTokVideos",
    JSON.stringify(cleanVideos)
  );
}


/* =========================
   FEED
========================= */

function renderFeed() {

  const feed = document.getElementById("feed");

  feed.innerHTML = "";

  if (videos.length === 0) {

    feed.innerHTML = `
      <div class="empty">
        <div>
          <h1>Welkom bij EdemTok 🔥</h1>
          <p>
            Er zijn nog geen video's.<br>
            Druk op + om je eerste video toe te voegen.
          </p>
        </div>
      </div>
    `;

    return;
  }

  videos.forEach((video, index) => {

    const card = document.createElement("section");

    card.className = "video-card";

    if (video.demo) {

      card.innerHTML = `
        <div
          style="
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#111,#ff0050,#00f2ea);
            font-size:45px;
            font-weight:bold;
          "
        >
          EdemTok 🔥
        </div>
      `;

    } else {

      const videoElement = document.createElement("video");

      videoElement.className = "video";
      videoElement.src = video.url;
      videoElement.loop = true;
      videoElement.muted = true;
      videoElement.playsInline = true;

      videoElement.addEventListener("click", () => {

        if (videoElement.paused) {
          videoElement.play();
        } else {
          videoElement.pause();
        }

      });

      card.appendChild(videoElement);
    }

    const info = document.createElement("div");

    info.className = "info";

    info.innerHTML = `
      <div class="username">
        @${escapeHTML(video.username)}
      </div>

      <div class="caption">
        ${escapeHTML(video.caption)}
      </div>
    `;

    card.appendChild(info);


    const actions = document.createElement("div");

    actions.className = "actions";

    actions.innerHTML = `
      <button
        class="action like ${video.liked ? "active" : ""}"
        onclick="likeVideo(${index})"
      >
        ♥
        <small>${video.likes}</small>
      </button>

      <button
        class="action"
        onclick="openComments(${index})"
      >
        💬
        <small>${video.comments.length}</small>
      </button>

      <button
        class="action"
        onclick="shareVideo(${index})"
      >
        ↗
        <small>Delen</small>
      </button>
    `;

    card.appendChild(actions);

    feed.appendChild(card);
  });
}


/* =========================
   LIKES
========================= */

function likeVideo(index) {

  const video = videos[index];

  if (video.liked) {

    video.likes--;
    video.liked = false;

  } else {

    video.likes++;
    video.liked = true;
  }

  saveData();
  renderFeed();
}


/* =========================
   UPLOAD
========================= */

function openUpload() {

  document
    .getElementById("uploadModal")
    .classList.add("show");

}


function addVideo() {

  const file =
    document.getElementById("videoFile").files[0];

  const username =
    document.getElementById("videoUsername").value.trim();

  const caption =
    document.getElementById("videoCaption").value.trim();


  if (!file) {

    alert("Kies eerst een video.");

    return;
  }


  if (!username) {

    alert("Vul je gebruikersnaam in.");

    return;
  }


  const url = URL.createObjectURL(file);


  const newVideo = {

    id: Date.now(),

    username: username,

    caption:
      caption || "Mijn nieuwe EdemTok-video 🔥",

    likes: 0,

    liked: false,

    comments: [],

    url: url,

    demo: false
  };


  videos.unshift(newVideo);

  /*
    De video blijft werken zolang deze pagina
    open blijft.
  */

  renderFeed();

  closeModal("uploadModal");

  document.getElementById("videoFile").value = "";
  document.getElementById("videoUsername").value = "";
  document.getElementById("videoCaption").value = "";

  document
    .getElementById("feed")
    .scrollTo({
      top: 0,
      behavior: "smooth"
    });
}


/* =========================
   COMMENTS
========================= */

function openComments(index) {

  currentCommentVideo = index;

  const video = videos[index];

  const list =
    document.getElementById("commentsList");

  list.innerHTML = "";

  if (video.comments.length === 0) {

    list.innerHTML =
      `<p style="color:#aaa;margin-bottom:15px;">
        Nog geen reacties.
      </p>`;

  } else {

    video.comments.forEach(comment => {

      const div =
        document.createElement("div");

      div.className = "comment";

      div.innerHTML = `
        <b>@${escapeHTML(comment.username)}</b><br>
        ${escapeHTML(comment.text)}
      `;

      list.appendChild(div);
    });
  }

  document
    .getElementById("commentsModal")
    .classList.add("show");
}


function sendComment() {

  const input =
    document.getElementById("commentInput");

  const text = input.value.trim();

  if (!text) return;


  let username =
    localStorage.getItem("edemTokUsername");

  if (!username) {
    username = "Edem";
  }


  videos[currentCommentVideo]
    .comments
    .push({

      username: username,

      text: text
    });


  input.value = "";

  saveData();

  openComments(currentCommentVideo);

  renderFeed();
}


/* =========================
   DELEN
========================= */

function shareVideo(index) {

  const video = videos[index];

  const text =
    `Kijk deze video van @${video.username} op EdemTok!`;


  if (navigator.share) {

    navigator.share({
      title: "EdemTok",
      text: text
    });

  } else {

    navigator.clipboard
      .writeText(text)
      .then(() => {

        alert("Tekst gekopieerd!");

      });

  }
}


/* =========================
   ZOEKEN
========================= */

function openSearch() {

  document
    .getElementById("searchModal")
    .classList.add("show");

  document
    .getElementById("searchInput")
    .focus();

  searchVideos();
}


function searchVideos() {

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  const results =
    document.getElementById("searchResults");

  results.innerHTML = "";


  const found =
    videos.filter(video =>

      video.username
        .toLowerCase()
        .includes(query)

      ||

      video.caption
        .toLowerCase()
        .includes(query)
    );


  if (found.length === 0) {

    results.innerHTML =
      `<p style="color:#aaa;">
        Geen video's gevonden.
      </p>`;

    return;
  }


  found.forEach(video => {

    const div =
      document.createElement("div");

    div.className = "result";

    div.innerHTML = `
      <b>@${escapeHTML(video.username)}</b><br>
      ${escapeHTML(video.caption)}
    `;

    results.appendChild(div);
  });
}


/* =========================
   PROFIEL
========================= */

function openProfile() {

  const username =
    localStorage.getItem("edemTokUsername") || "";

  document
    .getElementById("profileName")
    .value = username;


  document
    .getElementById("profileStats")
    .innerText =
      `Aantal video's: ${videos.length}`;


  document
    .getElementById("profileModal")
    .classList.add("show");
}


function saveProfile() {

  const name =
    document
      .getElementById("profileName")
      .value
      .trim();


  if (!name) {

    alert("Vul een gebruikersnaam in.");

    return;
  }


  localStorage.setItem(
    "edemTokUsername",
    name
  );


  alert("Profiel opgeslagen!");

  closeModal("profileModal");
}


/* =========================
   HOME
========================= */

function goHome() {

  const feed =
    document.getElementById("feed");

  feed.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   MODALS
========================= */

function closeModal(id) {

  document
    .getElementById(id)
    .classList.remove("show");
}


/* =========================
   VEILIGE TEKST
========================= */

function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   START
========================= */

loadData();

</script>

</body>
</html>
