<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edem Surfer - Official Game</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #334155;
        }

        canvas {
            background: #1e293b;
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
            pointer-events: none;
            z-index: 10;
        }

        #scoreBox { color: #f59e0b; }
        #coinBox { color: #eab308; }

        #menu {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 20px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn:hover { 
            background: #1d4ed8; 
            transform: scale(1.05); 
        }

        p { color: #94a3b8; margin: 5px 0; font-size: 15px; }
        b { color: #ffffff; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <div id="scoreBox">Score: <span id="score">0</span></div>
            <div id="coinBox">🪙 <span id="coins">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="menu">
            <h1 id="menuTitle">🏃‍♂️ Edem Surfer</h1>
            <p id="menuText">Ontwijk de rijdende treinen en de politie!</p>
            <p><b>⬅️ ➡️ of A / D:</b> Wissel van baan</p>
            <p><b>⬆️ of W:</b> Spring over muren/barrières</p>
            <p><b>⬇️ of S:</b> Buk onder hangende lichten</p>
            <button class="btn" id="startBtn" onclick="startGame()">Start Spel</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const coinsEl = document.getElementById("coins");
        const menu = document.getElementById("menu");
        const menuTitle = document.getElementById("menuTitle");
        const menuText = document.getElementById("menuText");
        const startBtn = document.getElementById("startBtn");

        let gameActive = false;
        let score = 0;
        let coins = 0;
        let gameSpeed = 6;
        let obstacles = [];
        let collectibles = [];
        
        const lanes =; 

        // Speler object (Edem)
        const player = {
            lane: 1, 
            x: 200,
            y: 480, // Iets omhoog gehaald zodat de politie eronder past
            radius: 18,
            jumpY: 0,
            isJumping: false,
            jumpArc: 0,
            isDucking: false,
            duckTimer: 0
        };

        // Politie Inspecteur object
        const police = {
            x: 200,
            y: 560,
            targetX: 200
        };

        window.addEventListener("keydown", (e) => {
            if (!gameActive) return;
            
            if ((e.key === "ArrowLeft" || e.key.toLowerCase() === "a") && player.lane > 0) {
                player.lane--;
            }
            if ((e.key === "ArrowRight" || e.key.toLowerCase() === "d") && player.lane < 2) {
                player.lane++;
            }
            if ((e.key === "ArrowUp" || e.key.toLowerCase() === "w") && !player.isJumping && !player.isDucking) {
                player.isJumping = true;
                player.jumpArc = 0;
            }
            if ((e.key === "ArrowDown" || e.key.toLowerCase() === "s") && !player.isJumping && !player.isDucking) {
                player.isDucking = true;
                player.duckTimer = 22; 
            }
        });

        function startGame() {
            score = 0;
            coins = 0;
            gameSpeed = 6;
            obstacles = [];
            collectibles = [];
            player.lane = 1;
            player.x = lanes[1];
            player.isJumping = false;
            player.jumpY = 0;
            player.isDucking = false;
            police.x = lanes[1];
            police.targetX = lanes[1];
            
            menu.style.display = "none";
            gameActive = true;
            
            animate();
        }

        function gameOver(reason) {
            gameActive = false;
            menuTitle.innerText = "Game Over!";
            menuText.innerHTML = `${reason}<br><br><b>Eindscore:</b> ${Math.floor(score)}<br>🪙 <b>Munten:</b> ${coins}`;
            startBtn.innerText = "Speel Opnieuw";
            menu.style.display = "flex";
        }

        function spawnObjects() {
            // Obstakels spawnen
            if (Math.random() < 0.03 && obstacles.length < 4) {
                let randomLane = Math.floor(Math.random() * 3);
                
                if (!obstacles.some(o => o.lane === randomLane && o.y < 250)) {
                    let typeRand = Math.random();
                    let type = "train"; 
                    let color = "#ef4444"; // Rode trein
                    let w = 48;
                    let h = 140;
                    let moving = Math.random() > 0.5; // 50% kans dat een trein RIJDT

                    if (typeRand < 0.30) {
                        type = "barrier"; // Lage muur / barrière
                        color = "#f59e0b"; 
                        h = 35;
                        moving = false;
                    } else if (typeRand < 0.55) {
                        type = "overhead"; // Hangend verkeersbord
                        color = "#38bdf8"; 
                        h = 40;
                        moving = false;
                    }

                    obstacles.push({
                        lane: randomLane,
                        x: lanes[randomLane],
                        y: -160,
                        width: w,
                        height: h,
                        type: type,
                        color: color,
                        isMoving: moving,
                        speedMultiplier: moving ? 1.4 : 1.0 // Bewegende treinen gaan sneller af op de speler
                    });
                }
            }

            // Munten spawnen
            if (Math.random() < 0.04 && collectibles.length < 6) {
                let randomLane = Math.floor(Math.random() * 3);
                if (!obstacles.some(o => o.lane === randomLane && o.y < 120)) {
                    collectibles.push({
                        lane: randomLane,
                        x: lanes[randomLane],
                        y: -30,
                        radius: 10
                    });
                }
            }
        }

        function update() {
            score += 0.2;
            scoreEl.innerText = Math.floor(score);
            
            // Snelheid loopt geleidelijk op
            gameSpeed = 6 + Math.floor(score / 500);

            // Vloeiende beweging van Edem naar zijn baan
            let targetX = lanes[player.lane];
            player.x += (targetX - player.x) * 0.25;

            // Volg-logica voor de Politie (rent achter Edem aan)
            police.targetX = lanes[player.lane];
            police.x += (police.targetX - police.x) * 0.15;

            // Sprong logica
            if (player.isJumping) {
                player.jumpArc += 0.08;
                player.jumpY = Math.sin(player.jumpArc) * 95; 
                if (player.jumpArc >= Math.PI) {
                    player.isJumping = false;
                    player.jumpY = 0;
                }
            }

            // Buk logica
            if (player.isDucking) {
                player.duckTimer--;
                if (player.duckTimer <= 0) {
                    player.isDucking = false;
                }
            }

            // Check alle obstakels
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                
                // Beweegt het object? Dan komt hij extra snel naar beneden (rijdende trein)
                o.y += gameSpeed * o.speedMultiplier;

                // Botsing detectie
                if (player.lane === o.lane) {
                    let pTop = player.y - player.jumpY - player.radius;
                    let pBottom = player.y - player.jumpY + player.radius;
                    
                    if (player.isDucking) {
                        pTop = player.y + 4; 
                    }
