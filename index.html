<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edem Surfer</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 20px;
            overflow: hidden;
        }

        canvas {
            background: #1e293b;
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        #scoreBox { color: #f59e0b; }
        #coinBox { color: #eab308; }

        #menu {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }

        h1 {
            font-size: 40px;
            margin: 0 0 10px 0;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn:hover { background: #1d4ed8; transform: scale(1.05); }
        p { color: #94a3b8; margin: 5px 0; font-size: 15px; }
        b { color: white; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <div id="scoreBox">Score: <span id="score">0</span></div>
            <div id="coinBox">🪙 <span id="coins">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="menu">
            <h1 id="menuTitle">🏃‍♂️ Edem Surfer</h1>
            <p id="menuText">Gebruik de <b>Pijltjestoetsen</b> om te skaten!</p>
            <p>⬅️ ➡️ Wissel van baan</p>
            <p>⬆️ Spring over barrières | ⬇️ Buk onder lichten</p>
            <button class="btn" id="startBtn" onclick="startGame()">Start Spel</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const coinsEl = document.getElementById("coins");
        const menu = document.getElementById("menu");
        const menuTitle = document.getElementById("menuTitle");
        const menuText = document.getElementById("menuText");
        const startBtn = document.getElementById("startBtn");

        let gameActive = false;
        let score = 0;
        let coins = 0;
        let gameSpeed = 5;
        let obstacles = [];
        let collectibles = [];
        
        // De exacte X-coördinaten voor de 3 banen
        const lanes =; 

        const player = {
            lane: 1, 
            x: 200,
            y: 500,
            radius: 18,
            jumpY: 0,
            isJumping: false,
            jumpArc: 0,
            isDucking: false,
            duckTimer: 0
        };

        window.addEventListener("keydown", (e) => {
            if (!gameActive) return;
            
            if (e.key === "ArrowLeft" && player.lane > 0) {
                player.lane--;
            }
            if (e.key === "ArrowRight" && player.lane < 2) {
                player.lane++;
            }
            if (e.key === "ArrowUp" && !player.isJumping && !player.isDucking) {
                player.isJumping = true;
                player.jumpArc = 0;
            }
            if (e.key === "ArrowDown" && !player.isJumping && !player.isDucking) {
                player.isDucking = true;
                player.duckTimer = 25; // Aantal frames bukken
            }
        });

        function startGame() {
            score = 0;
            coins = 0;
            gameSpeed = 6;
            obstacles = [];
            collectibles = [];
            player.lane = 1;
            player.x = lanes[1];
            player.isJumping = false;
            player.jumpY = 0;
            player.isDucking = false;
            
            menu.style.display = "none";
            gameActive = true;
            
            animate();
        }

        function gameOver() {
            gameActive = false;
            menuTitle.innerText = "Game Over!";
            menuText.innerHTML = `De inspecteur heeft je gegrepen!<br><b>Score:</b> ${Math.floor(score)} | <b>Munten:</b> ${coins}`;
            startBtn.innerText = "Speel Opnieuw";
            menu.style.display = "flex";
        }

        function spawnObjects() {
            // Spawnen van treinen en barrières
            if (Math.random() < 0.02 && obstacles.length < 3) {
                let randomLane = Math.floor(Math.random() * 3);
                
                if (!obstacles.some(o => o.lane === randomLane && o.y < 200)) {
                    let typeRand = Math.random();
                    let type = "train"; // Standaard grote trein
                    let color = "#ef4444";
                    let w = 46;
                    let h = 130;

                    if (typeRand < 0.35) {
                        type = "barrier"; // Lage barrière (Springen!)
                        color = "#f59e0b";
                        h = 35;
                    } else if (typeRand < 0.60) {
                        type = "overhead"; // Hoge barrière / Licht (Bukken!)
                        color = "#38bdf8";
                        h = 40;
                    }

                    obstacles.push({
                        lane: randomLane,
                        x: lanes[randomLane],
                        y: -150,
                        width: w,
                        height: h,
                        type: type,
                        color: color
                    });
                }
            }

            // Spawnen van munten
            if (Math.random() < 0.04 && collectibles.length < 6) {
                let randomLane = Math.floor(Math.random() * 3);
                if (!obstacles.some(o => o.lane === randomLane && o.y < 100)) {
                    collectibles.push({
                        lane: randomLane,
                        x: lanes[randomLane],
                        y: -30,
                        radius: 10
                    });
                }
            }
        }

        function update() {
            score += 0.15;
            scoreEl.innerText = Math.floor(score);
            
            // Snelheid loopt heel geleidelijk op
            gameSpeed = 6 + Math.floor(score / 300);

            // Vloeiende zijwaartse beweging naar de actieve baan
            let targetX = lanes[player.lane];
            player.x += (targetX - player.x) * 0.3;

            // Sprong animatie regelen
            if (player.isJumping) {
                player.jumpArc += 0.07;
                player.jumpY = Math.sin(player.jumpArc) * 95; 
                if (player.jumpArc >= Math.PI) {
                    player.isJumping = false;
                    player.jumpY = 0;
                }
            }

            // Buk animatie regelen
            if (player.isDucking) {
                player.duckTimer--;
                if (player.duckTimer <= 0) {
                    player.isDucking = false;
                }
            }

            // Check obstakels
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.y += gameSpeed;

                // Hitbox logica
                if (player.lane === o.lane) {
                    let pTop = player.y - player.jumpY - player.radius;
                    let pBottom = player.y - player.jumpY + player.radius;
                    
                    if (player.isDucking) {
                        pTop = player.y + 5; // Kleiner doelwit bij bukken
                    }

                    // Controleer of speler verticaal overlapt met het obstakel
                    if (pBottom > o.y && pTop < o.y + o.height) {
                        
                        if (o.type === "barrier" && player.jumpY > 25) {
                            // Veilig over de lage barrière heen gesprongen
                        } else if (o.type === "overhead" && player.isDucking) {
                            // Veilig onder het hangende bord door gedoken
                        } else {
                            gameOver();
                            return;
                        }
                    }
                }

                if (o.y > canvas.height) obstacles.splice(i, 1);
            }

            // Check munten verzamelen
            for (let i = collectibles.length - 1; i >= 0; i--) {
                let c = collectibles[i];
                c.y += gameSpeed;

                let currentY = player.y - player.jumpY;
                let dist = Math.hypot(player.x - c.x, currentY - c.y);

                if (dist < player.radius + c.radius + 5) {
                    coins++;
                    coinsEl.innerText = coins;
