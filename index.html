<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edem Surfer - Premium Edition</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #090d16;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 420px;
            height: 640px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid #1e293b;
            background: #111827;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #111827, #1f2937);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
            pointer-events: none;
            z-index: 10;
        }

        #scoreBox { color: #f59e0b; background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 8px; }
        #coinBox { color: #eab308; background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 8px; }

        #powerupUI {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
        }

        .active-bar {
            width: 120px;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
            display: none;
        }

        .active-bar-fill {
            height: 100%;
            width: 100%;
            background: #10b981;
        }

        #menu {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-size: 46px;
            margin: 0 0 10px 0;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 22px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            margin-top: 25px;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        .btn:hover { 
            background: #1d4ed8; 
            transform: scale(1.05); 
        }

        .instructions {
            background: rgba(30, 41, 59, 0.5);
            padding: 15px;
            border-radius: 14px;
            margin-top: 15px;
            max-width: 320px;
        }

        .instructions p { color: #94a3b8; margin: 6px 0; font-size: 14px; text-align: left; }
        .instructions b { color: #ffffff; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <div id="scoreBox">SCORE: <span id="score">0</span></div>
            <div id="coinBox">🪙 <span id="coins">0</span></div>
        </div>

        <!-- Powerup Status Balken -->
        <div id="powerupUI">
            <div id="boardBar" class="active-bar">
                <div style="font-size:11px; color:#10b981; margin-bottom:2px;">🛹 HOVERBOARD ACTIVE</div>
                <div class="active-bar-fill" id="boardFill"></div>
            </div>
            <div id="magnetBar" class="active-bar">
                <div style="font-size:11px; color:#a855f7; margin-bottom:2px;">🧲 MAGNET ACTIVE</div>
                <div class="active-bar-fill" id="magnetFill" style="background:#a855f7;"></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="420" height="640"></canvas>

        <div id="menu">
            <h1 id="menuTitle">🏃‍♂️ Edem Surfer</h1>
            <p style="color: #64748b; font-size: 18px; margin: 0;">Subway Edition</p>
            
            <div class="instructions">
                <p><b>⬅️ ➡️ of A / D:</b> Wissel direct van baan [3]</p>
                <p><b>⬆️ of W:</b> Spring over muren & obstakels [3]</p>
                <p><b>⬇️ of S:</b> Buk onder hangende tunnels [3]</p>
                <p><b>SPATIEBALK:</b> Activeer Hoverboard (indien bezit)</p>
            </div>

            <button class="btn" id="startBtn" onclick="startGame()">START SPEL</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const coinsEl = document.getElementById("coins");
        const menu = document.getElementById("menu");
        const menuTitle = document.getElementById("menuTitle");
        const startBtn = document.getElementById("startBtn");
        const boardBar = document.getElementById("boardBar");
        const boardFill = document.getElementById("boardFill");
        const magnetBar = document.getElementById("magnetBar");
        const magnetFill = document.getElementById("magnetFill");

        // Game state engine
        let gameActive = false;
        let score = 0;
        let coins = 0;
        let gameSpeed = 6;
        let obstacles = [];
        let collectibles = [];
        let particles = [];
        
        // Exacte 3 banen gecentreerd op breedte 420
        const lanes =; 

        // Speler eigenschappen (Edem) [3]
        const player = {
            lane: 1, 
            x: 210,
            y: 500,
            radius: 18,
            jumpY: 0,
            isJumping: false,
            jumpArc: 0,
            isDucking: false,
            duckTimer: 0,
            // Inventory & Powerups
            hasBoard: false,
            boardActive: false,
            boardTime: 0,
            magnetActive: false,
            magnetTime: 0
        };

        // Politie Inspecteur & Hond [3]
        const police = {
            x: 210,
            y: 580,
            targetX: 210,
            frame: 0
        };

        // Knoppen detectie (Pijltjes + WASD + Spatie) [3]
        window.addEventListener("keydown", (e) => {
            if (!gameActive) return;
            
            if ((e.key === "ArrowLeft" || e.key.toLowerCase() === "a") && player.lane > 0) {
                player.lane--;
            }
            if ((e.key === "ArrowRight" || e.key.toLowerCase() === "d") && player.lane < 2) {
                player.lane++;
            }
            if ((e.key === "ArrowUp" || e.key.toLowerCase() === "w") && !player.isJumping && !player.isDucking) {
                player.isJumping = true;
                player.jumpArc = 0;
            }
            if ((e.key === "ArrowDown" || e.key.toLowerCase() === "s") && !player.isJumping && !player.isDucking) {
                player.isDucking = true;
                player.duckTimer = 24; 
            }
            if (e.key === " " && player.hasBoard && !player.boardActive) {
                player.hasBoard = false;
                player.boardActive = true;
                player.boardTime = 600; // 10 seconden op 60fps
                boardBar.style.display = "block";
            }
        });

        function createParticle(x, y, color) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function startGame() {
            // Volledige fabrieksreset van alle variabelen [3]
            score = 0;
            coins = 0;
            gameSpeed = 6.5;
            obstacles = [];
            collectibles = [];
            particles = [];
            
            player.lane = 1;
            player.x = lanes[1];
            player.isJumping = false;
            player.jumpY = 0;
            player.isDucking = false;
            player.hasBoard = false;
            player.boardActive = false;
            player.magnetActive = false;

            police.x = lanes[1];
            police.targetX = lanes[1];

            boardBar.style.display = "none";
            magnetBar.style.display = "none";
            
            menu.style.display = "none";
            gameActive = true;
            
            // Start de game loop direct [3]
            animate();
        }

        function gameOver(reason) {
            gameActive = false;
            menuTitle.innerText = "🚨 GEPRAKT!";
            menu.style.display = "flex";
            startBtn.innerText = "OPNIEUW PROBEREN";
            document.getElementById("menuText").innerHTML = `<span style="color:#ef4444">${reason}</span><br><br><b>Eindscore:</b> ${Math.floor(score)}<br>🪙 <b>Munten verzameld:</b> ${coins}`;
        }

        function spawnManager() {
            // Genereer obstakels (willekeurige opbouw) [3]
            if (Math.random() < 0.025 && obstacles.length < 4) {
                let lane = Math.floor(Math.random() * 3);
