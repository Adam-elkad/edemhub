<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdemGames - Poki Theater Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #5c3bc4; /* De iconische paarse Poki kleur */
            color: white;
            overflow-x: hidden;
        }

        /* Top Bar */
        header {
            background: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #5c3bc4;
            text-transform: uppercase;
            letter-spacing: -1px;
            cursor: pointer;
        }

        .logo span {
            background: #ffcc00;
            color: black;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 4px;
        }

        /* Categorie Knoppen */
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 25px;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }

        .category-btn.active, .category-btn:hover {
            background: #ffcc00;
            color: black;
            transform: scale(1.05);
        }

        /* Games Grid Layout */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            transition: opacity 0.3s;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        /* Poki kleurenkaarten */
        .game-card.pink { background: #ff5376; }
        .game-card.green { background: #2bd980; }
        .game-card.blue { background: #2cc9f3; }
        .game-card.orange { background: #ff9100; }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        .game-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .game-thumbnail {
            font-size: 55px;
            margin-bottom: 8px;
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            color: black;
        }

        /* --- POKI BLACK THEATER OVERLAY (HET ZWARTE SCHERM) --- */
        #theaterScreen {
            position: fixed;
            inset: 0;
            background: #000000; /* Pikzwart scherm zoals Poki */
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Laadscherm animatie */
        #loaderArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .poki-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #ffcc00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* De actieve game container */
        #gameWrapper {
            width: 100%;
            max-width: 800px;
            height: 80vh;
            background: #111827;
            border-radius: 24px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255,255,255,0.05);
            border: 2px solid #222;
        }

        .theater-header {
            background: #111;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .theater-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffcc00;
        }

        .close-btn {
            background: #ff5376;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover { background: #e12d53; transform: scale(1.05); }

        .game-canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            position: relative;
        }

        /* Interne arcade knop styling */
        .arcade-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 22px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #1d4ed8;
        }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1d4ed8; }
    </style>
</head>
<body>

    <!-- PORTAL HOOFDSCHERM -->
    <div id="portalScreen">
        <header>
            <div class="logo">Poki<span>Hub</span></div>
            <div style="font-weight: bold; color: #5c3bc4; background: #ffcc00; padding: 5px 12px; border-radius: 15px;">Edem's Arcade</div>
        </header>

        <div class="categories">
            <button class="category-btn active">🕹️ Alle Spellen</button>
        </div>

        <div class="main-container">
            <div class="games-grid">
                <!-- Game 1: Space Clicker -->
                <div class="game-card pink" onclick="openTheater('clicker', 'Space Clicker')">
                    <div class="game-thumbnail">🚀</div>
                    <div class="game-info"><div class="game-title">Space Clicker</div></div>
                </div>
                <!-- Game 2: Retro Snake -->
                <div class="game-card green" onclick="openTheater('snake', 'Retro Snake')">
                    <div class="game-thumbnail">🐍</div>
                    <div class="game-info"><div class="game-title">Retro Snake</div></div>
                </div>
                <!-- Game 3: Geheugenspel -->
                <div class="game-card blue" onclick="openTheater('memory', 'Geheugenspel')">
                    <div class="game-thumbnail">🧠</div>
                    <div class="game-info"><div class="game-title">Geheugenspel</div></div>
                </div>
                <!-- Game 4: Reactietest -->
                <div class="game-card orange" onclick="openTheater('reaction', 'Reactietest')">
                    <div class="game-thumbnail">⚡</div>
                    <div class="game-info"><div class="game-title">Reactietest</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- HET POKI ZWARTE BIOSCOOPSCHERM OVERLAY -->
    <div id="theaterScreen">
        <!-- Nep Poki laadeffect -->
        <div id="loaderArea">
            <div class="poki-spinner"></div>
            <h3 style="letter-spacing: 1px; color: #ffcc00;" id="loadingText">SPEL LADEN...</h3>
        </div>

        <!-- De actieve game container -->
        <div id="gameWrapper">
            <div class="theater-header">
                <div class="theater-title" id="theaterGameTitle">Game</div>
                <button class="close-btn" onclick="closeTheater()">❌ SLUITEN</button>
            </div>
            <div class="game-canvas-area" id="canvasContainer">
                <!-- Hier wordt de gekozen game direct ingeladen via JS -->
            </div>
        </div>
    </div>

    <script>
        // --- THEATER NAVIGATIE MOTOR ---
        function openTheater(gameId, gameTitle) {
            // Verberg de portal, toon het zwarte scherm en de loader
            document.getElementById('portalScreen').style.opacity = "0.3";
            document.getElementById('theaterScreen').style.display = "flex";
            document.getElementById('loaderArea').style.display = "flex";
            document.getElementById('gameWrapper').style.display = "none";
            document.getElementById('loadingText').innerText = gameTitle.toUpperCase() + " LADEN...";

            // Na 1 seconde laden start de game in het donkere theater, net als op Poki!
            setTimeout(() => {
                document.getElementById('loaderArea').style.display = "none";
                document.getElementById('gameWrapper').style.display = "flex";
                document.getElementById('theaterGameTitle').innerText = gameTitle;
                buildMiniGame(gameId);
            }, 1000);
        }

        function closeTheater() {
            document.getElementById('theaterScreen').style.display = "none";
