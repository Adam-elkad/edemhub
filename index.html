<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdemGames - Retro Snake Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #5c3bc4;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SCHERM 1: HOMEPAGE PORTAL --- */
        #portalScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #5c3bc4;
        }

        header {
            background: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #5c3bc4;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .logo span {
            background: #ffcc00;
            color: black;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 4px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
            background: #2bd980;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        .game-thumbnail {
            font-size: 55px;
            margin-bottom: 8px;
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            color: black;
        }

        /* --- SCHERM 2: APART SNAKE SPEELPLATFORM --- */
        #snakePlatform {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: none; /* Hidden on launch */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .top-navigation {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .backspace-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b91c1c;
            text-transform: uppercase;
        }

        .backspace-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b91c1c;
        }

        .score-counter {
            font-size: 22px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #snakeCanvas {
            background: #1e293b;
            border: 4px solid #334155;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: block;
        }

        .controls-note {
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- SCHERM 1: HOMEPAGE PORTAL -->
    <div id="portalScreen">
        <header>
            <div class="logo">Poki<span>Hub</span></div>
            <div style="font-weight: bold; color: black; background: #ffcc00; padding: 5px 12px; border-radius: 15px;">Edem's Arcade</div>
        </header>

        <div class="main-container">
            <div class="games-grid">
                <div class="game-card" onclick="switchToSnakePlatform()">
                    <div class="game-thumbnail">🐍</div>
                    <div class="game-info"><div class="game-title">Retro Snake</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCHERM 2: APART SNAKE SPEELPLATFORM -->
    <div id="snakePlatform">
        <div class="top-navigation">
            <button class="backspace-btn" onclick="returnToHomePortal()">⬅ TERUG</button>
            <div class="score-counter">SCORE: <span id="liveScore">0</span></div>
        </div>

        <canvas id="snakeCanvas" width="378" height="378"></canvas>
        
        <div class="controls-note">Gebruik de Pijltjestoetsen om te sturen</div>
    </div>

    <script>
        let runtimeLoopTicker = null;
        
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        
        const gridSizeUnits = 21;
        const cellPixelDimension = 18;

        let snakeCoordinates = [];
        let activeApple = { x: 0, y: 0 };
        let vectorX = 1;
        let vectorY = 0;
        let scoreTracker = 0;

        // INSTANT SCREEN SWITCHER SYSTEM
        function switchToSnakePlatform() {
            document.getElementById("portalScreen").style.display = "none";
            document.getElementById("snakePlatform").style.display = "flex";
            
            initializeSnakeGame();
        }

        function returnToHomePortal() {
            if (runtimeLoopTicker) {
                clearInterval(runtimeLoopTicker);
                runtimeLoopTicker = null;
            }
            window.onkeydown = null;

            document.getElementById("snakePlatform").style.display = "none";
            document.getElementById("portalScreen").style.display = "flex";
        }

        // SNAKE ENGINE INITIALIZATION
        function initializeSnakeGame() {
            if (runtimeLoopTicker) clearInterval(runtimeLoopTicker);
            
            scoreTracker = 0;
            document.getElementById("liveScore").innerText = scoreTracker;
            
            // Snake anatomy structure array data assignment
            snakeCoordinates = [
                { x: 10, y: 10 },
                { x: 9, y: 10 }
            ];
            
            vectorX = 1;
            vectorY = 0;

            generateRandomApplePosition();

            window.onkeydown = function(e) {
                if (e.key === "ArrowLeft" && vectorX === 0)  { vectorX = -1; vectorY = 0; }
                if (e.key === "ArrowRight" && vectorX === 0) { vectorX = 1;  vectorY = 0; }
                if (e.key === "ArrowUp" && vectorY === 0)    { vectorX = 0;  vectorY = -1; }
                if (e.key === "ArrowDown" && vectorY === 0)  { vectorX = 0;  vectorY = 1; }
            };

            runtimeLoopTicker = setInterval(processEngineFrameUpdate, 130);
        }

        function generateRandomApplePosition() {
            activeApple.x = Math.floor(Math.random() * gridSizeUnits);
            activeApple.y = Math.floor(Math.random() * gridSizeUnits);

            if (snakeCoordinates.some(part => part.x === activeApple.x && part.y === activeApple.y)) {
                generateRandomApplePosition();
            }
        }

        // ENGINE PHYSICS MATRIX UPDATER
        function processEngineFrameUpdate() {
            // FIXED: Target index array parameters verified fixed [0]
            let structuralHead = { 
                x: snakeCoordinates[0].x + vectorX, 
                y: snakeCoordinates[0].y + vectorY 
            };

            if (structuralHead.x < 0 || structuralHead.x >= gridSizeUnits || structuralHead.y < 0 || structuralHead.y >= gridSizeUnits) {
                initializeSnakeGame();
                return;
            }

            if (snakeCoordinates.some(segment => segment.x === structuralHead.x && segment.y === structuralHead.y)) {
                initializeSnakeGame();
                return;
            }

            snakeCoordinates.unshift(structuralHead);

            if (structuralHead.x === activeApple.x && structuralHead.y === activeApple.y) {
                scoreTracker++;
                document.getElementById("liveScore").innerText = scoreTracker;
                generateRandomApplePosition();
            } else {
                snakeCoordinates.pop();
            }

            renderSimulationFrames();
        }

        // RENDERING CANVAS PIPELINE
        function renderSimulationFrames() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render checker chessboard structure backgrounds
            for (let row = 0; row < gridSizeUnits; row++) {
                for (let col = 0; col < gridSizeUnits; col++) {
                    if ((row + col) % 2 === 0) {
                        ctx.fillStyle = "#1e293b"; 
                    } else {
                        ctx.fillStyle = "#111827"; 
                    }
                    ctx.fillRect(col * cellPixelDimension, row * cellPixelDimension, cellPixelDimension, cellPixelDimension);
                }
            }

            // Render apple item targets
