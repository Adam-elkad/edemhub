<!DOCTYPE html>
<html>
<head>
    <title>EdemHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 45px;
        }

        p {
            color: #9ca3af;
        }

        .grid {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        .card {
            background: #1f2937;
            width: 200px;
            padding: 25px;
            border-radius: 18px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🎮 EdemHub</h1>
    <p>Games • School • Websites</p>

    <div class="grid">

        <div class="card">
            <h2>🎮 Games</h2>
            <p>Mijn games</p>
            <button>Open</button>
        </div>

        <div class="card">
            <h2>📚 School</h2>
            <p>Handige schooltools</p>
            <button>Open</button>
        </div>

        <div class="card">
            <h2>🌐 Websites</h2>
            <p>Mijn websites</p>
            <button>Open</button>
        </div>

    </div>

</body>
</html>
