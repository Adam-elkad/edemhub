<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdemGames - Retro Snake Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #5c3bc4;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SCREEN 1: HOMEPAGE PORTAL --- */
        #portalScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #5c3bc4;
        }

        header {
            background: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #5c3bc4;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .logo span {
            background: #ffcc00;
            color: black;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 4px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
            background: #2bd980;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        .game-thumbnail {
            font-size: 55px;
            margin-bottom: 8px;
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            color: black;
        }

        /* --- SCREEN 2: BLACK SNAKE GAMEPLAY PLATFORM --- */
        #snakePlatform {
            position: absolute;
            inset: 0;
            background: #000000; /* Turns completely black as requested */
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .top-navigation {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .backspace-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b91c1c;
            text-transform: uppercase;
        }

        .backspace-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b91c1c;
        }

        /* Menu layout text items inside black screen */
        .game-menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .menu-item-text {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.15s, color 0.15s;
            text-transform: uppercase;
        }

        #playBtn { color: #2bd980; }
        #skinsBtn { color: #2cc9f3; }
        #fruitBtn { color: #ff5376; }

        .menu-item-text:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: PORTAL MAIN HOMEPAGE -->
    <div id="portalScreen">
        <header>
            <div class="logo">Poki<span>Hub</span></div>
            <div style="font-weight: bold; color: black; background: #ffcc00; padding: 5px 12px; border-radius: 15px;">Edem's Arcade</div>
        </header>

        <div class="main-container">
            <div class="games-grid">
                <div class="game-card" onclick="switchToSnakePlatform()">
                    <div class="game-thumbnail">🐍</div>
                    <div class="game-info"><div class="game-title">Retro Snake</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: APART SNAKE SPEELPLATFORM (BLACK EDITION) -->
    <div id="snakePlatform">
        <div class="top-navigation">
            <button class="backspace-btn" onclick="returnToHomePortal()">⬅ TERUG</button>
        </div>

        <!-- The menu text blocks built right inside the black frame -->
        <div class="game-menu-container">
            <div class="menu-item-text" id="playBtn" onclick="selectMenuOption('play')">PLAY</div>
            <div class="menu-item-text" id="skinsBtn" onclick="selectMenuOption('skins')">SKINS</div>
            <div class="menu-item-text" id="fruitBtn" onclick="selectMenuOption('fruit')">FRUIT</div>
        </div>
    </div>

    <script>
        // INTERACTIVE TRANSITION ENGINES
        function switchToSnakePlatform() {
            document.getElementById("portalScreen").style.display = "none";
            document.getElementById("snakePlatform").style.display = "flex";
        }

        function returnToHomePortal() {
            document.getElementById("snakePlatform").style.display = "none";
            document.getElementById("portalScreen").style.display = "flex";
        }

        // TRIGGER SUBROUTINE OPTIONS
        function selectMenuOption(option) {
            if (option === 'play') {
                alert("Je hebt op PLAY gedrukt! Tijd om te skaten.");
            } else if (option === 'skins') {
                alert("Je hebt op SKINS gedrukt! Kies een vette outfit.");
            } else if (option === 'fruit') {
                alert("Je hebt op FRUIT gedrukt! Kies je lievelingseten.");
            }
        }
    </script>
</body>
</html>
