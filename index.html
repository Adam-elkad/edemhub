<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdemGames - Poki Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #5c3bc4;
            color: white;
            overflow-x: hidden;
        }

        header {
            background: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #5c3bc4;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .logo span {
            background: #ffcc00;
            color: black;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 4px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        .game-card.pink { background: #ff5376; }
        .game-card.green { background: #2bd980; }
        .game-card.blue { background: #2cc9f3; }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
        }

        .game-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .game-thumbnail {
            font-size: 55px;
            margin-bottom: 8px;
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            color: black;
        }

        /* SCREEN 2: BLACK THEATER MODUS */
        #theaterScreen {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #gameWrapper {
            width: 100%;
            max-width: 600px;
            height: 520px;
            background: #1e293b;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #334155;
        }

        .theater-header {
            background: #111827;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .theater-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffcc00;
        }

        .close-btn {
            background: #ff5376;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .close-btn:hover { background: #e12d53; }

        .game-content-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
        }

        .arcade-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #1d4ed8;
            margin-top: 15px;
        }
        .arcade-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1d4ed8; }
    </style>
</head>
<body>

    <!-- SCREEN 1: PORTAL HOMEPAGE -->
    <div id="portalScreen">
        <header>
            <div class="logo">Poki<span>Hub</span></div>
            <div style="font-weight: bold; color: black; background: #ffcc00; padding: 5px 12px; border-radius: 15px;">Edem's Arcade</div>
        </header>

        <div class="main-container">
            <div class="games-grid">
                <!-- Game 1: Space Clicker -->
                <div class="game-card pink" onclick="launchGame('clicker', 'Space Clicker')">
                    <div class="game-thumbnail">🚀</div>
                    <div class="game-info"><div class="game-title">Space Clicker</div></div>
                </div>
                <!-- Game 2: Retro Snake -->
                <div class="game-card green" onclick="launchGame('snake', 'Retro Snake')">
                    <div class="game-thumbnail">🐍</div>
                    <div class="game-info"><div class="game-title">Retro Snake</div></div>
                </div>
                <!-- Game 3: Geheugenspel -->
                <div class="game-card blue" onclick="launchGame('memory', 'Geheugenspel')">
                    <div class="game-thumbnail">🧠</div>
                    <div class="game-info"><div class="game-title">Geheugenspel</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: POKI THEATER OVERLAY -->
    <div id="theaterScreen">
        <div id="gameWrapper">
            <div class="theater-header">
                <div class="theater-title" id="theaterGameTitle">Game</div>
                <button class="close-btn" onclick="exitTheater()">❌ SLUITEN</button>
            </div>
            <div class="game-content-area" id="gamePlayground">
                <!-- Spellen laden hier live in -->
            </div>
        </div>
    </div>

    <script>
        let snakeInterval = null;

        // LAUNCH GAME SWITCHER
        function launchGame(gameId, gameTitle) {
            document.getElementById('portalScreen').style.display = "none";
            document.getElementById('theaterScreen').style.display = "flex";
            document.getElementById('theaterGameTitle').innerText = gameTitle;

            const playground = document.getElementById('gamePlayground');
            playground.innerHTML = ""; // Scherm leegmaken

            // GAME 1: SPACE CLICKER
            if (gameId === 'clicker') {
                let score = 0;
                playground.innerHTML = `
                    <div style="text-align:center;">
                        <h1 style="font-size: 40px; color:#ffcc00; margin-bottom:20px;" id="scoreDisplay">🚀 0 Scraps</h1>
                        <button class="arcade-btn" id="clickActionBtn">KLIK HIER</button>
                    </div>`;
                
                document.getElementById('clickActionBtn').onclick = function() {
                    score++;
                    document.getElementById('scoreDisplay').innerText = `🚀 ${score} Scraps`;
                };
            }

            // GAME 2: RETRO SNAKE
            if (gameId === 'snake') {
                playground.innerHTML = `
                    <div style="text-align:center;">
                        <h3 id="snakeScore" style="color:#ffcc00; margin-bottom:10px;">Score: 0</h3>
                        <canvas id="snakeCanvas" width="300" height="300" style="border:3px solid #334155; background:#111827; display:block; border-radius:10px;"></canvas>
                        <p style="font-size:12px; color:#94a3b8; margin-top:8px;">Gebruik de Pijltjestoetsen om te sturen!</p>
                    </div>`;

                const canvas = document.getElementById('snakeCanvas');
                const ctx = canvas.getContext('2d');
                const gridCell = 15;
                
                let snake = [{x: 10, y: 10}];
                let food = {x: 5, y: 5};
                let dx = 1, dy = 0;
                let currentScore = 0;

                // Toetsenbord besturing koppelen
                window.onkeydown = function(e) {
                    if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
                    if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
                    if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
                    if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
                };

                // Game Loop voor Snake
                snakeInterval = setInterval(() => {
                    let head = {x: snake[0].x + dx, y: snake[0].y + dy};

                    // Check muurbotsing
                    if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                        clearInterval(snakeInterval);
                        alert("Game Over! Eindscore: " + currentScore);
                        exitTheater();
                        return;
                    }

                    snake.unshift(head);

                    // Check of slang voedsel eet
                    if (head.x === food.x && head.y === food.y) {
                        currentScore += 10;
                        document.getElementById('snakeScore').innerText = "Score: " + currentScore;
                        food = {
                            x: Math.floor(Math.random() * 20),
                            y: Math.floor(Math.random() * 20)
