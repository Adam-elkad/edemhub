<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Eerste Website</title>
    <style>
        /* CSS voor de opmaak */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background: #0078d7;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
            background: #fff;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background: #333;
            color: #fff;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welkom op mijn website</h1>
    </header>

    <main>
        <h2>Over deze pagina</h2>
        <p>Dit is een schoon en eenvoudig sjabloon om te beginnen met [HTML-code](https://www.doublesmart.nl/wat-is/html-code/).</p>
        <button onclick="toonMelding()">Klik mij</button>
    </main>

    <footer>
        <p>&copy; 2026 Mijn Website</p>
    </footer>

    <script>
        /* JavaScript voor interactiviteit */
        function toonMelding() {
            alert('Hallo! Bedankt voor het klikken.');
        }
    </script>

</body>
</html>
