<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EdemTok - TikTok Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #010101;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* TIKTOK APP CONTAINER (MOBIEL FORMAAT) */
        #appContainer {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #000000;
            position: relative;
            box-shadow: 0 0 40px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        /* ONEINDIGE VIDEO FEED (SCROLL SNAP) */
        .video-feed {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Verberg scrollbar Firefox */
        }

        .video-feed::-webkit-scrollbar {
            display: none; /* Verberg scrollbar Chrome/Safari */
        }

        /* APART VIDEO CONTAINER SEGMENT */
        .video-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        /* INTERNE VISUELE VIDEO SIMULATIE (DYNAMISCHE GRADIENT EN EMOJI'S) */
        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* RECHTER ACTIEBALK (LIKES, COMMENTS, SHARES) */
        .side-bar {
            position: absolute;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .action-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .action-button:active {
            transform: scale(0.85);
        }

        .action-icon {
            width: 45px;
            height: 45px;
            background: rgba(40, 40, 40, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-bottom: 5px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .action-icon.liked {
            color: #ff0050; /* TikTok Rood */
            background: rgba(255, 0, 80, 0.2);
            border-color: #ff0050;
        }

        .action-count {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        /* ONDERSTE TEKSTBALK (CREATOR INFO & DESCRIPTION) */
        .bottom-info {
            position: absolute;
            left: 20px;
            bottom: 30px;
            right: 80px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .creator-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .creator-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .follow-btn {
            background: #ff0050;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .follow-btn.following {
            background: rgba(255,255,255,0.2);
            color: #ccc;
        }

        .video-desc {
            font-size: 14px;
            line-height: 1.4;
            color: #f1f1f1;
        }

        .music-track {
            font-size: 13px;
            color: #2bd980; /* Neon groen voor muziek */
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        /* --- POP-UP REACTIES SCHERM --- */
        #commentOverlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65%;
            background: #121212;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 100;
            display: none;
            flex-direction: column;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            border-top: 1px solid #222;
        }

        .comment-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .comment-title { font-size: 15px; font-weight: 700; }
        .close-comments { font-size: 20px; cursor: pointer; color: #888; }

        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            font-size: 14px;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            background: #ffcc00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .comment-body h5 { font-weight: 700; color: #aaa; margin-bottom: 2px; }

        /* VASTE NAVIGATIEBALK ONDERAAN */
        nav {
            height: 65px;
            background: #000000;
            border-top: 1px solid #161616;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: #888;
            cursor: pointer;
        }

        .nav-item.active { color: #ffffff; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        /* Special TikTok Plus Center Button */
        .nav-plus-btn {
            width: 45px;
            height: 30px;
            background: #ffffff;
            border-radius: 8px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: 18px;
            font-weight: 900;
            box-shadow: -3px 0 #00f2fe, 3px 0 #fe0979; /* De blauw/roze TikTok gloed */
        }
    </style>
</head>

        <div class="video-feed" id="mainFeed" onscroll="handleVideoScroll()">

        <div id="commentOverlay">

        <!-- NAVIGATIEBALK ONDERAAN -->

            <div class="nav-item"><div class="nav-icon">👤</div>Profiel</div>
        </nav>
    </div>
